<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fondo: noche del asentamiento -->
  <rect width="512" height="512" rx="96" fill="#0d120c"/>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <defs>
    <radialGradient id="g" cx="0.5" cy="1.1" r="0.9">
      <stop offset="0%" stop-color="#ff8c3b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3c5a2a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d120c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carta" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#efe2bd"/>
      <stop offset="100%" stop-color="#d4bf8b"/>
    </linearGradient>
  </defs>
  <!-- carta trasera -->
  <rect x="150" y="96" width="200" height="290" rx="18"
        fill="#2c3625" stroke="#d9a93f" stroke-width="8"
        transform="rotate(-12 250 241)"/>
  <!-- carta delantera (pergamino) -->
  <rect x="166" y="120" width="200" height="290" rx="18"
        fill="url(#carta)" stroke="#8a7350" stroke-width="8"
        transform="rotate(7 266 265)"/>
  <!-- espada sobre la carta -->
  <g transform="rotate(7 266 265)">
    <rect x="256" y="160" width="22" height="170" rx="8" fill="#9fb4c7"/>
    <polygon points="256,160 278,160 267,132" fill="#9fb4c7"/>
    <rect x="222" y="320" width="90" height="20" rx="9" fill="#8a4d0f"/>
    <rect x="258" y="338" width="18" height="46" rx="7" fill="#5e3608"/>
    <circle cx="267" cy="394" r="14" fill="#d9a93f"/>
  </g>
  <!-- brasa -->
  <circle cx="130" cy="120" r="10" fill="#ffd166"/>
  <circle cx="396" cy="170" r="7" fill="#ff8c3b"/>
  <circle cx="120" cy="392" r="6" fill="#ff8c3b"/>
</svg>
