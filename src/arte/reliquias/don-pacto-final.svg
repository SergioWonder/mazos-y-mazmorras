<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <radialGradient id="h"><stop offset="0" stop-color="#fff0b8" stop-opacity="0.75"/><stop offset="1" stop-color="#ffd060" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- holy halo -->
  <circle cx="32" cy="32" r="31" fill="url(#h)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffe08a" stroke-width="3" opacity="0.8" filter="url(#g)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#140d0a" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#e8b440" stroke-width="1.6"/>
  <!-- chains hanging from the eye -->
  <g fill="none" stroke-linecap="round">
    <path d="M18 34 V58" stroke="#140d0a" stroke-width="4.4" stroke-dasharray="4 2.4"/>
    <path d="M18 34 V58" stroke="#b8b0c4" stroke-width="2" stroke-dasharray="4 2.4"/>
    <path d="M46 34 V58" stroke="#140d0a" stroke-width="4.4" stroke-dasharray="4 2.4"/>
    <path d="M46 34 V58" stroke="#b8b0c4" stroke-width="2" stroke-dasharray="4 2.4"/>
  </g>
  <!-- abyssal glow -->
  <path d="M6 30 Q32 6 58 30 Q32 54 6 30 Z" fill="#c98bff" opacity="0.8" filter="url(#g)"/>
  <!-- eye -->
  <path d="M6 30 Q32 8 58 30 Q32 52 6 30 Z" fill="#f0e4ff" stroke="#140d0a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M10 30 Q32 44 54 30 Q32 48 10 30 Z" fill="#c8b0e8"/>
  <circle cx="32" cy="30" r="11" fill="#b04ad8" stroke="#140d0a" stroke-width="2.4"/>
  <circle cx="32" cy="30" r="6.6" fill="#e070ff"/>
  <ellipse cx="32" cy="30" rx="2.4" ry="7.4" fill="#140d0a"/>
  <circle cx="28" cy="26" r="2" fill="#ffffff"/>
  <!-- lashes / horns -->
  <path d="M14 22 L10 14 M22 17 L20 9 M42 17 L44 9 M50 22 L54 14" stroke="#140d0a" stroke-width="2.6" stroke-linecap="round"/>
  <!-- chain shackles -->
  <circle cx="18" cy="35" r="3" fill="none" stroke="#140d0a" stroke-width="3.2"/>
  <circle cx="18" cy="35" r="3" fill="none" stroke="#d6d0e0" stroke-width="1.4"/>
  <circle cx="46" cy="35" r="3" fill="none" stroke="#140d0a" stroke-width="3.2"/>
  <circle cx="46" cy="35" r="3" fill="none" stroke="#d6d0e0" stroke-width="1.4"/>
</svg>
