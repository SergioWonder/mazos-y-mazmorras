  <circle cx="32" cy="32" r="26" fill="none" stroke="#e8b440" stroke-width="1.6"/>
  <!-- wooden staff -->
  <path d="M18 56 L38 22" stroke="#140d0a" stroke-width="6.4" stroke-linecap="round"/>
