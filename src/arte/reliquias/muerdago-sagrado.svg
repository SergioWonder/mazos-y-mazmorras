<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <path id="l" d="M0 0 Q6 -6 16 -4 Q10 4 0 0 Z"/>
  </defs>
  <circle cx="32" cy="36" r="18" fill="#a8e070" opacity="0.35" filter="url(#g)"/>
  <!-- forked stems -->
  <path d="M32 8 L32 22 L20 40 M32 22 L44 40 M32 22 L32 46" stroke="#140d0a" stroke-width="4.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 8 L32 22 L20 40 M32 22 L44 40 M32 22 L32 46" stroke="#8a9a50" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- paired leaves -->
  <g fill="#7aa648" stroke="#140d0a" stroke-width="2" stroke-linejoin="round">
    <use href="#l" transform="translate(21 39) rotate(150) scale(1.3)"/>
    <use href="#l" transform="translate(21 39) rotate(100) scale(1.3)"/>
    <use href="#l" transform="translate(43 39) rotate(30) scale(1.3)"/>
    <use href="#l" transform="translate(43 39) rotate(80) scale(1.3)"/>
    <use href="#l" transform="translate(32 45) rotate(60) scale(1.2)"/>
    <use href="#l" transform="translate(32 45) rotate(120) scale(1.2)"/>
  </g>
  <!-- white berries -->
  <g fill="#f4f0dc" stroke="#140d0a" stroke-width="1.4">
    <circle cx="28" cy="30" r="3.2"/>
    <circle cx="36" cy="30" r="3.2"/>
    <circle cx="32" cy="34" r="3.2"/>
  </g>
  <circle cx="27" cy="29" r="1" fill="#ffffff"/>
  <!-- golden ribbon knot -->
  <path d="M26 8 Q32 13 38 8 L36 14 Q32 16 28 14 Z" fill="#c9a040" stroke="#140d0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 14 L22 22 M36 14 L42 22" stroke="#140d0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 14 L22 22 M36 14 L42 22" stroke="#c9a040" stroke-width="1.8" stroke-linecap="round"/>
</svg>
