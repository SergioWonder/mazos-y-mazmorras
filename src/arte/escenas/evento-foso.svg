  <path d="M190 104 L206 96 M198 100 L202 106" stroke="#5a4028" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M172 122 L184 124 L182 128 L170 126 Z" fill="#5a4028" stroke="#140d0a" stroke-width="1.4"/>

