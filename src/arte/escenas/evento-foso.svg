  <!-- strap and pouch details on the pack -->
  <path d="M140 94 L158 96 M148 82 L148 110" stroke="#2a1c22" stroke-width="1"/>
  <!-- strain lines: the pack pulls down -->
  <path d="M162 100 L162 112 M166 96 L166 114 M170 102 L170 110" stroke="#ff9a7a" stroke-width="1" opacity="0.7" stroke-linecap="round"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
