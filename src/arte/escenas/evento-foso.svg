<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e2218"/>
      <stop offset="1" stop-color="#220a06"/>
    </linearGradient>
    <linearGradient id="hoyo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c140c"/>
      <stop offset="1" stop-color="#0c0503"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.44" cy="0.46" r="0.34">
      <stop offset="0" stop-color="#ff6a4a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff6a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- blood-red dusk over the woods -->
  <rect width="320" height="180" fill="url(#cielo)"/>
