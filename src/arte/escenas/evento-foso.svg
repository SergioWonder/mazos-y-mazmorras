  <path d="M127.3 137.5 L129.5 145.5 L125.7 145.5 Z M139.2 144.9 L141.4 152.9 L137.6 152.9 Z M151.4 139.5 L153.6 147.5 L149.8 147.5 Z M162.9 135.0 L165.1 143.0 L161.3 143.0 Z M179.0 143.2 L181.2 151.2 L177.4 151.2 Z M190.4 142.2 L192.6 150.2 L188.8 150.2 Z M201.7 140.5 L203.9 148.5 L200.1 148.5 Z M215.5 138.6 L217.7 146.6 L213.9 146.6 Z M230.6 139.7 L232.8 147.7 L229.0 147.7 Z" fill="#7a1a14" stroke="#140d0a" stroke-width="0.8" stroke-linejoin="round"/>

