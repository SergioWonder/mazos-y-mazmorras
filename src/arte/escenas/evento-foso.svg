    <path d="M122 58 Q126 52 130 56 L132 60 L136 78 L130 78 Z"/>
    <circle cx="138.5" cy="69" r="6.5"/>
    <path d="M124 76 Q134 72 140 80 L139 106 Q130 111 122 106 Z"/>
    <path d="M124 104 L119 132 L125 134 L130 108 Z M131 106 L135 132 L141 131 L138 104 Z"/>
    <path d="M118 132 L126 134 L124 137 L116 135 Z M134 132 L142 130 L143 133 L135 135 Z"/>
