<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a38"/>
      <stop offset="1" stop-color="#101810"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.36">
      <stop offset="0" stop-color="#b8e07a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#b8e07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="niebla" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <!-- sickly sky slit between the cliffs -->
  <rect width="320" height="180" fill="url(#cielo)"/>
  <rect width="320" height="180" fill="url(#halo)"/>
  <!-- distant cliffs deep in the defile -->
  <path d="M120 180 L124 60 L134 44 L140 70 L146 52 L152 180 Z M200 180 L182 58 L190 40 L198 64 L206 50 L214 180 Z" fill="#26301e"/>
  <!-- the winding path -->
  <path d="M150 104 L170 104 Q190 130 176 150 Q164 166 196 180 L108 180 Q140 166 146 146 Q150 124 150 104 Z" fill="#3a3a2a"/>
  <path d="M170 104 Q190 130 176 150 Q164 166 196 180 L178 180 Q156 166 168 150 Q178 128 164 104 Z" fill="#2a2a1e"/>

  <!-- left cliff wall -->
  <path d="M0 0 L96 0 L104 20 L96 40 L112 64 L104 88 L122 112 L116 140 L134 180 L0 180 Z" fill="#2e3426" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M60 0 L96 0 L104 20 L96 40 L112 64 L104 88 L122 112 L116 140 L134 180 L100 180 L92 140 L96 112 L82 88 L88 64 L74 40 L80 20 Z" fill="#1e231a"/>
  <path d="M96 2 L102 20 M97 42 L110 63 M106 90 L120 111" fill="none" stroke="#5a6448" stroke-width="1.6"/>
  <path d="M20 30 L50 36 M10 80 L44 74 M30 120 L66 128 M16 156 L52 150" fill="none" stroke="#161a12" stroke-width="1"/>
  <!-- right cliff wall -->
  <path d="M320 0 L222 0 L214 24 L226 46 L206 72 L218 96 L198 122 L210 148 L190 180 L320 180 Z" fill="#262c20" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M320 0 L250 0 L244 24 L256 46 L238 72 L250 96 L232 122 L244 148 L226 180 L320 180 Z" fill="#181d14"/>
  <path d="M270 40 L300 34 M256 90 L292 96 M262 140 L300 134" fill="none" stroke="#10140c" stroke-width="1"/>
  <!-- dead tree clinging to the right cliff -->
  <path d="M216 94 Q228 86 234 72 Q238 62 250 56 M230 80 Q240 80 250 74 M236 66 Q232 58 226 52 M244 60 L252 62" fill="none" stroke="#140d0a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M216 94 Q228 86 234 72" fill="none" stroke="#140d0a" stroke-width="4.4" stroke-linecap="round"/>

  <!-- fog, back layer -->
  <path d="M100 96 Q130 84 160 94 Q190 84 222 96 Q210 110 160 108 Q116 112 100 96 Z" fill="#9ad070" opacity="0.4" filter="url(#niebla)"/>
  <!-- ghostly faces within the fog -->
  <g opacity="0.55">
    <path d="M138 70 Q138 58 148 58 Q158 58 158 70 Q158 84 148 90 Q138 84 138 70 Z" fill="#c8f0a0" filter="url(#suave)"/>
    <path d="M141 68 Q144 64 147 68 Q144 72 141 68 Z M150 68 Q153 64 156 68 Q153 72 150 68 Z M145 78 Q148 74 151 78 Q148 84 145 78 Z" fill="#101810"/>
  </g>
  <g opacity="0.45">
    <path d="M178 76 Q178 64 188 62 Q198 64 198 76 Q196 90 188 94 Q180 90 178 76 Z" fill="#c8f0a0" filter="url(#suave)"/>
    <path d="M181 73 Q184 69 187 74 Q184 77 181 73 Z M190 74 Q193 69 196 73 Q193 77 190 74 Z M185 84 Q188 80 192 84 Q188 88 185 84 Z" fill="#101810"/>
  </g>
  <g opacity="0.35">
    <path d="M114 110 Q114 100 122 99 Q130 100 130 110 Q128 122 122 124 Q116 122 114 110 Z" fill="#c8f0a0" filter="url(#suave)"/>
    <path d="M116 108 Q119 105 121 109 Q118 111 116 108 Z M123 109 Q126 105 128 108 Q126 111 123 109 Z M119 116 Q122 113 125 116 Q122 120 119 116 Z" fill="#101810"/>
  </g>
  <!-- whisper trails leaving the mouths -->
  <path d="M148 84 Q142 96 150 104 Q158 112 150 122 M188 90 Q196 102 188 112 M122 120 Q112 132 120 142" fill="none" stroke="#c8f0a0" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/>

  <!-- fog, front layers creeping over the path -->
  <path d="M40 136 Q80 116 130 128 Q170 112 214 128 Q260 116 300 136 Q270 154 214 146 Q170 158 120 148 Q70 156 40 136 Z" fill="#8ac060" opacity="0.5" filter="url(#niebla)"/>
  <path d="M-10 164 Q50 144 110 158 Q170 140 230 158 Q290 144 330 162 L330 190 L-10 190 Z" fill="#6aa04a" opacity="0.55" filter="url(#niebla)"/>
  <!-- crisp wisps for the ink look -->
  <path d="M60 140 Q90 130 120 138 M170 128 Q200 120 230 130 M90 162 Q130 152 170 160 Q200 150 240 160" fill="none" stroke="#d8f8b0" stroke-width="1.1" opacity="0.7" stroke-linecap="round"/>
  <path d="M70 146 Q100 138 128 144 M200 136 Q230 130 260 140" fill="none" stroke="#a8d880" stroke-width="0.8" opacity="0.6"/>

  <!-- sickly motes -->
  <path d="M130 40h0.1M176 48h0.1M104 122h0.1M214 110h0.1M160 130h0.1M246 150h0.1M80 150h0.1" stroke="#c8f0a0" stroke-width="3.4" stroke-linecap="round" opacity="0.7" filter="url(#suave)"/>
  <path d="M130 40h0.1M176 48h0.1M104 122h0.1M214 110h0.1M160 130h0.1M246 150h0.1M80 150h0.1" stroke="#f0ffe0" stroke-width="1.2" stroke-linecap="round"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
