<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e3c"/>
      <stop offset="0.7" stop-color="#5a6070"/>
      <stop offset="1" stop-color="#3a3e48"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#eef2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="rayo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4f6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f4f6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="niebla" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="320" height="180" fill="url(#cielo)"/>
  <!-- distant ruined wall silhouette -->
  <path d="M0 110 L0 76 L14 76 L14 70 L26 70 L26 80 L44 80 L44 64 L52 60 L58 66 L58 110 Z M262 110 L262 70 L272 62 L280 68 L280 78 L300 78 L300 66 L312 66 L312 74 L320 74 L320 110 Z" fill="#3a3e4a"/>
  <path d="M0 100 Q60 90 120 98 Q200 88 320 98 L320 120 L0 120 Z" fill="#6a7080" opacity="0.5" filter="url(#niebla)"/>
  <rect width="320" height="180" fill="url(#halo)"/>
  <!-- pale light rising from the altar -->
  <path d="M146 96 L110 0 L136 0 L156 96 Z M164 96 L184 0 L210 0 L174 96 Z M156 96 L152 0 L168 0 L164 96 Z" fill="url(#rayo)"/>

  <!-- collapsed arch behind the altar -->
  <path d="M104 132 L104 64 Q106 30 140 22 Q160 18 176 24 L170 34 Q148 30 132 42 Q120 54 120 70 L120 132 Z" fill="#6e7282" stroke="#140d0a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M104 64 Q106 30 140 22 L142 30 Q116 40 112 64 L112 132 L104 132 Z" fill="#8a8e9e"/>
  <path d="M104 80 L120 80 M104 100 L120 100 M104 118 L120 118 M110 44 L122 52 M132 26 L136 38 M152 21 L154 30" stroke="#140d0a" stroke-width="1" fill="none"/>
  <path d="M200 132 L200 70 L204 60 L210 66 L216 56 L216 132 Z" fill="#5a5e6e" stroke="#140d0a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M200 86 L216 86 M200 106 L216 106" stroke="#140d0a" stroke-width="1"/>

  <!-- left broken column -->
  <path d="M40 152 L44 74 L50 68 L56 74 L62 66 L70 72 L72 152 Z" fill="#7a7e8e" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M62 66 L70 72 L72 152 L62 152 Z" fill="#555a68"/>
  <path d="M50 76 L50 150 M56 76 L56 150" stroke="#140d0a" stroke-width="0.9"/>
  <path d="M46 78 L47 150" stroke="#a8acbc" stroke-width="1.6"/>
  <path d="M34 152 L78 152 L76 144 L36 144 Z" fill="#6a6e7e" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- ivy -->
  <path d="M60 70 Q54 90 62 104 Q56 118 60 132" fill="none" stroke="#140d0a" stroke-width="3"/>
  <path d="M60 70 Q54 90 62 104 Q56 118 60 132" fill="none" stroke="#4a5a44" stroke-width="1.6"/>
  <!-- right broken column, taller -->
  <path d="M244 154 L248 50 L256 42 L262 50 L270 46 L276 154 Z" fill="#7a7e8e" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M264 48 L270 46 L276 154 L264 154 Z" fill="#555a68"/>
  <path d="M254 52 L254 152 M260 52 L260 152" stroke="#140d0a" stroke-width="0.9"/>
  <path d="M250 54 L251 152" stroke="#a8acbc" stroke-width="1.6"/>
  <path d="M238 154 L282 154 L280 146 L240 146 Z" fill="#6a6e7e" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- fallen drum of a column -->
  <path d="M196 156 Q194 146 204 144 L228 144 Q236 146 234 156 Q232 162 224 162 L204 162 Q196 162 196 156 Z" fill="#6e7282" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="228" cy="153" rx="6" ry="9" fill="#8a8e9e" stroke="#140d0a" stroke-width="1.6"/>

  <!-- floor -->
  <path d="M0 140 Q160 128 320 140 L320 180 L0 180 Z" fill="#3e424e"/>
  <path d="M90 150 L230 150 M110 140 L100 168 M160 138 L160 170 M210 140 L222 168" stroke="#2a2e38" stroke-width="1.2"/>

  <!-- central altar with steps -->
  <path d="M116 146 L204 146 L208 156 L112 156 Z" fill="#6a6e7e" stroke="#140d0a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M124 136 L196 136 L200 146 L120 146 Z" fill="#7a7e8e" stroke="#140d0a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M136 104 L184 104 L186 136 L134 136 Z" fill="#8a8e9e" stroke="#140d0a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M170 104 L184 104 L186 136 L172 136 Z" fill="#62667a"/>
  <path d="M130 98 L190 98 L188 106 L132 106 Z" fill="#9a9eae" stroke="#140d0a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M134 100 L176 100" stroke="#d8dcea" stroke-width="1.4"/>
  <path d="M142 114 Q160 108 178 114 M150 124 L170 124" fill="none" stroke="#140d0a" stroke-width="1"/>
  <path d="M146 120 L150 128 L146 132" fill="none" stroke="#140d0a" stroke-width="1.2"/>

  <!-- the shining relic on the altar -->
  <circle cx="160" cy="88" r="16" fill="#fff4d0" opacity="0.7" filter="url(#brillo)"/>
  <path d="M152 97 L168 97 L166 93 L154 93 Z" fill="#b8903a" stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M160 93 L160 88" stroke="#140d0a" stroke-width="3"/>
  <path d="M160 93 L160 88" stroke="#d8b050" stroke-width="1.4"/>
  <path d="M160 74 L168 86 L160 92 L152 86 Z" fill="#f0f4ff" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M160 74 L168 86 L160 92 Z" fill="#c0c8e8"/>
  <path d="M156 82 L160 76" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M160 64 L160 70 M146 78 L150 80 M174 78 L170 80 M150 68 L153 72 M170 68 L167 72" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- whispering prayers drifting from the walls -->
  <path d="M74 90 Q90 84 100 92 Q110 100 124 94 M214 76 Q228 70 236 78 Q244 86 256 80 M78 118 Q92 112 104 118" fill="none" stroke="#e8ecff" stroke-width="3" opacity="0.35" filter="url(#brillo)"/>
  <path d="M74 90 Q90 84 100 92 Q110 100 124 94 M214 76 Q228 70 236 78 Q244 86 256 80 M78 118 Q92 112 104 118" fill="none" stroke="#dce2ff" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.8"/>
  <g fill="#eef2ff" opacity="0.9">
    <path d="M86 84 L88 80 L90 84 Z"/>
    <path d="M232 70 L234 66 L236 70 Z"/>
    <circle cx="112" cy="92" r="1"/>
    <circle cx="246" cy="78" r="1"/>
    <circle cx="94" cy="112" r="0.9"/>
  </g>

  <!-- mist banks rolling over the floor -->
  <path d="M-10 150 Q40 136 90 146 Q140 156 180 146 Q240 134 330 148 L330 168 L-10 168 Z" fill="#c8ccda" opacity="0.4" filter="url(#niebla)"/>
  <path d="M-10 166 Q60 154 130 164 Q200 172 260 160 Q300 154 330 162 L330 190 L-10 190 Z" fill="#aab0c0" opacity="0.5" filter="url(#niebla)"/>
  <path d="M20 128 Q60 120 90 128 M230 124 Q260 118 300 126" fill="none" stroke="#d8dcea" stroke-width="6" opacity="0.3" filter="url(#niebla)"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
