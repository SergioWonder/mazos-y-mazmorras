  <path d="M136 84 L140 92 L138 98 L146 98" fill="none" stroke="#140d0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gushing water arc -->
  <path d="M140 96 Q170 88 186 108 Q198 124 200 144" fill="none" stroke="#d8f0ff" stroke-width="12" opacity="0.55" filter="url(#brillo)"/>
  <path d="M140 94 Q170 84 188 106 Q200 122 204 144 L194 144 Q192 124 182 112 Q168 98 140 100 Z" fill="url(#agua)" stroke="#140d0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M146 95 Q170 88 184 104 Q194 118 198 140" fill="none" stroke="#eaf8ff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M150 98 Q168 94 178 106" fill="none" stroke="#eaf8ff" stroke-width="0.9" stroke-linecap="round"/>

