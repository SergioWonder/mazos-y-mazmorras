<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5e74"/>
      <stop offset="0.6" stop-color="#9aa6a8"/>
      <stop offset="1" stop-color="#c8b898"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.66" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.44" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#d8f0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d8f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec4dc"/>
      <stop offset="1" stop-color="#3a6a88"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- dawn sky over the hills -->
  <rect width="320" height="180" fill="url(#cielo)"/>
  <rect width="320" height="180" fill="url(#sol)"/>
  <circle cx="212" cy="96" r="14" fill="#fff6e0" opacity="0.8" filter="url(#brillo)"/>
  <path d="M-10 34 Q20 22 50 28 Q66 20 86 28 Q100 30 96 36 Z M170 30 Q196 18 222 24 Q240 16 262 24 Q282 26 278 32 Z" fill="#6a7888"/>
  <path d="M-10 34 Q20 22 50 28 Q66 20 86 28 M170 30 Q196 18 222 24 Q240 16 262 24" fill="none" stroke="#e8d8c0" stroke-width="1.4" opacity="0.8"/>
  <path d="M120 58 Q150 50 176 56 Q200 52 220 60 Z" fill="#8a929a" opacity="0.8"/>
  <path d="M0 104 Q40 84 84 96 Q130 80 170 94 Q220 82 260 92 Q292 84 320 92 L320 180 L0 180 Z" fill="#6a7a78"/>
  <path d="M0 116 Q60 100 110 112 Q170 100 230 110 Q280 102 320 110 L320 180 L0 180 Z" fill="#4e5e58"/>
  <!-- distant trees -->
  <path d="M250 110 L256 90 L262 110 Z M264 110 L268 96 L272 110 Z M30 112 L36 92 L42 112 Z M44 112 L48 98 L52 112 Z" fill="#3c4a44"/>
  <rect width="320" height="180" fill="url(#halo)"/>

  <!-- meadow -->
  <path d="M0 128 Q80 118 160 124 Q240 118 320 126 L320 180 L0 180 Z" fill="#5a6a44"/>
  <path d="M0 128 Q80 118 160 124 L160 128 Q80 122 0 132 Z" fill="#7a8a58"/>

  <!-- back white rocks, angular and faceted -->
  <path d="M84 130 L88 104 L102 86 L118 80 L132 64 L152 60 L170 68 L180 84 L178 98 L194 108 L196 130 Z" fill="#d8d4c8" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M152 60 L170 68 L180 84 L178 98 L194 108 L196 130 L166 130 L172 110 L164 92 L166 76 Z" fill="#a6a296"/>
  <path d="M104 88 L118 82 L132 66 L150 62" fill="none" stroke="#f6f4ee" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M118 80 L122 100 L108 116 M132 64 L140 84 M122 100 L146 106 L150 128 M164 92 L150 96" fill="none" stroke="#140d0a" stroke-width="1"/>
  <path d="M90 104 L96 106" stroke="#f6f4ee" stroke-width="1.6" stroke-linecap="round"/>
