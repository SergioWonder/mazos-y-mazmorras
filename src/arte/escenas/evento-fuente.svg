  <path d="M58 154 L60 134 L74 120 L94 118 L108 124 L124 124 L132 140 L128 156 Z" fill="#e2ded2" stroke="#140d0a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M108 124 L124 124 L132 140 L128 156 L106 156 L116 140 Z" fill="#aeaa9e"/>
  <path d="M62 134 L74 122 L92 120" fill="none" stroke="#fafaf4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M94 118 L96 136 L84 148 M96 136 L116 140" fill="none" stroke="#140d0a" stroke-width="1"/>
  <path d="M206 154 L208 136 L220 126 L238 126 L248 138 L248 156 Z" fill="#dcd8cc" stroke="#140d0a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M232 126 L238 126 L248 138 L248 156 L232 156 L240 140 Z" fill="#a8a498"/>
  <path d="M210 136 L220 128 L230 128" fill="none" stroke="#fafaf4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252 158 L256 146 L268 142 L276 150 L274 160 Z" fill="#cfcabc" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M268 142 L276 150 L274 160 L264 160 Q270 150 268 142 Z" fill="#a09c90"/>

  <!-- pool -->
  <path d="M112 150 Q150 138 200 142 Q236 144 250 156 Q210 168 160 166 Q120 164 112 150 Z" fill="#4a86a4" stroke="#140d0a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M200 142 Q236 144 250 156 Q220 164 190 165 Q226 154 200 142 Z" fill="#35657e"/>
  <ellipse cx="199" cy="146" rx="14" ry="3" fill="none" stroke="#eaf8ff" stroke-width="1.2"/>
  <ellipse cx="199" cy="147" rx="26" ry="6" fill="none" stroke="#b8e0f0" stroke-width="0.9" opacity="0.8"/>
  <path d="M130 154 Q146 150 162 153 M150 160 Q166 157 180 160" fill="none" stroke="#b8e0f0" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="199" cy="142" rx="18" ry="7" fill="#eaf8ff" opacity="0.5" filter="url(#brillo)"/>
  <!-- splash drops -->
  <path d="M190 140 Q186 134 188 130 M206 140 Q212 134 212 130 M198 138 L198 132" fill="none" stroke="#eaf8ff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- blessed glints -->
  <g fill="#e8f6ff" opacity="0.8" filter="url(#suave)">
    <circle cx="168" cy="82" r="4"/>
    <circle cx="210" cy="124" r="3.5"/>
    <circle cx="150" cy="148" r="3.5"/>
    <circle cx="186" cy="96" r="3"/>
    <circle cx="228" cy="150" r="3"/>
  </g>
  <g fill="#ffffff">
    <path d="M168 76 L169 81 L174 82 L169 83 L168 88 L167 83 L162 82 L167 81 Z"/>
    <path d="M210 119 L210.8 123 L215 124 L210.8 125 L210 129 L209.2 125 L205 124 L209.2 123 Z"/>
    <path d="M150 143 L150.8 147 L155 148 L150.8 149 L150 153 L149.2 149 L145 148 L149.2 147 Z"/>
    <circle cx="186" cy="96" r="1.2"/>
    <circle cx="228" cy="150" r="1.2"/>
    <circle cx="176" cy="70" r="0.9"/>
  </g>

  <!-- reeds and grass -->
  <path d="M38 166 Q34 144 26 124 Q38 142 44 166 Z M46 166 Q50 146 60 132 Q54 150 52 166 Z M30 166 Q24 154 14 148 Q28 152 36 166 Z M268 166 Q266 140 258 122 Q272 140 274 166 Z M276 166 Q282 148 292 136 Q286 152 282 166 Z M284 166 Q294 156 304 152 Q294 160 290 166 Z" fill="#4e5e34" stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M0 168 Q80 160 160 170 Q240 162 320 168 L320 180 L0 180 Z" fill="#3a4a2e"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
