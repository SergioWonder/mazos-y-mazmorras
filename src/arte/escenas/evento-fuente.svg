  <path d="M130 66 Q138 60 148 62 Q142 66 136 66 Z M176 100 Q186 100 192 108 Q184 106 178 104 Z" fill="#6a7a48" stroke="#140d0a" stroke-width="1.2" stroke-linejoin="round"/>
