  <path d="M168 152 Q172 146 178 150 Q176 156 168 152 Z M182 156 Q188 150 194 155 Q190 160 182 156 Z M198 156 Q204 151 210 155 Q206 160 198 156 Z M214 152 Q220 146 224 151 Q222 156 214 152 Z M170 142 Q174 138 178 142 Z M216 142 Q220 138 224 142 Z" fill="#4a4048" stroke="#140d0a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- logs -->
  <path d="M170 150 L214 138 L216 143 L172 155 Z M174 138 L218 150 L216 155 L172 143 Z" fill="#5a3a24" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M176 145 L212 141 M180 146 L210 150" stroke="#ff6a2a" stroke-width="1.2" opacity="0.8"/>

  <!-- fire: glow, then crisp flames -->
  <path d="M176 146 Q172 124 184 116 Q182 102 190 92 Q192 108 198 110 Q204 100 202 88 Q216 110 210 128 Q216 136 208 146 Z" fill="#ff9a50" filter="url(#brillo)"/>
  <path d="M178 146 Q174 126 185 118 Q184 104 190 96 Q193 110 199 112 Q205 102 203 92 Q215 112 209 128 Q214 138 207 146 Z" fill="#e0602a" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M184 146 Q182 132 190 124 Q190 114 194 108 Q196 120 200 120 Q204 114 204 106 Q210 124 204 134 Q206 142 202 146 Z" fill="#ff9a50"/>
  <path d="M190 146 Q188 138 193 132 Q194 126 196 122 Q198 130 200 134 Q202 140 199 146 Z" fill="#ffe0a0"/>

  <!-- sparks rising -->
  <path d="M192 84h0.1M200 74h0.1M186 66h0.1M206 58h0.1M194 48h0.1M212 40h0.1M184 36h0.1M202 26h0.1M218 70h0.1M178 80h0.1" stroke="#ff9a50" stroke-width="3.6" stroke-linecap="round" opacity="0.8" filter="url(#suave)"/>
  <path d="M192 84h0.1M200 74h0.1M186 66h0.1M206 58h0.1M194 48h0.1M212 40h0.1M184 36h0.1M202 26h0.1M218 70h0.1M178 80h0.1" stroke="#ffe8c0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- thin smoke -->
  <path d="M198 88 Q190 70 202 56 Q212 42 204 24" fill="none" stroke="#8a8098" stroke-width="3" opacity="0.2" filter="url(#suave)"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
