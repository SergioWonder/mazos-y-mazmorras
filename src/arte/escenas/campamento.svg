<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a38"/>
      <stop offset="1" stop-color="#2a2238"/>
    </linearGradient>
    <radialGradient id="fuego" cx="0.6" cy="0.76" r="0.42">
      <stop offset="0" stop-color="#ff9a50" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff9a50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>

  <!-- starry sky -->
  <rect width="320" height="180" fill="url(#cielo)"/>
  <path d="M30 14h0.1M58 30h0.1M84 10h0.1M110 36h0.1M140 18h0.1M168 8h0.1M196 28h0.1M226 12h0.1M252 38h0.1M280 18h0.1M300 44h0.1M124 56h0.1M70 52h0.1M212 50h0.1M152 40h0.1M44 40h0.1M268 58h0.1" stroke="#e0e8ff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M96 22 L96 30 M92 26 L100 26 M238 26 L238 32 M235 29 L241 29" stroke="#e0e8ff" stroke-width="3" opacity="0.5" filter="url(#suave)"/>
  <path d="M96 22 L96 30 M92 26 L100 26 M238 26 L238 32 M235 29 L241 29" stroke="#ffffff" stroke-width="0.9"/>
  <!-- faint milky band -->
  <path d="M0 70 Q120 20 320 30 L320 44 Q140 36 0 86 Z" fill="#a8b0e0" opacity="0.06"/>

  <!-- distant ridge and far pines -->
  <path d="M0 110 Q50 84 100 98 Q150 80 200 96 Q250 78 320 96 L320 140 L0 140 Z" fill="#171a2c"/>
  <path d="M60 116 L66 96 L72 116 Z M84 112 L91 88 L98 112 Z M226 110 L232 88 L238 110 Z M246 114 L252 94 L258 114 Z" fill="#12142a"/>
  <rect width="320" height="180" fill="url(#fuego)"/>

