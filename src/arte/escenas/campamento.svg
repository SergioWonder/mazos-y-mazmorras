  <path d="M10 140 L10 124 L-8 124 L6 104 L-4 104 L10 80 L2 80 L16 50 L30 80 L22 80 L36 104 L26 104 L40 124 L22 124 L22 140 Z" fill="#0a0d18" stroke="#140d0a" stroke-width="2"/>
  <path d="M290 140 L290 122 L268 122 L284 98 L272 98 L288 72 L278 72 L296 36 L314 72 L304 72 L320 98 L308 98 L326 122 L302 122 L302 140 Z" fill="#0a0d18" stroke="#140d0a" stroke-width="2"/>
  <path d="M284 98 L296 98 M288 72 L298 72 M268 122 L290 122" fill="none" stroke="#ff9a50" stroke-width="1" opacity="0.35"/>

  <!-- ground -->
  <path d="M0 136 Q160 126 320 136 L320 180 L0 180 Z" fill="#1e1a22"/>
  <path d="M100 146 Q190 132 290 150 Q200 170 100 158 Z" fill="#4a2e22" opacity="0.7"/>
  <path d="M20 160 L24 150 L27 160 M270 166 L274 156 L277 166 M60 170 L63 162 L66 170" fill="none" stroke="#2e2a34" stroke-width="1.4"/>

