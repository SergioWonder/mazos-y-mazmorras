  <path d="M46 150 Q44 140 54 138 L96 140 Q104 142 102 150 Q100 156 92 156 L54 156 Q46 156 46 150 Z" fill="#5a4a3a" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M60 150 L96 150 Q100 150 100 154 Q96 156 92 156 L56 156 Z" fill="#3e3228"/>
  <path d="M54 138 Q46 140 46 148 Q50 144 56 144 Q60 146 60 150 Q62 142 54 138 Z" fill="#7a2e22" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M72 139 L72 156 M86 140 L86 156" stroke="#2a1c14" stroke-width="2"/>
  <path d="M58 140 L96 141" stroke="#8a7458" stroke-width="1"/>

