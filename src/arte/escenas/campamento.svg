    <path d="M120 104 Q116 90 128 86 Q140 86 140 98 Q140 106 133 109 Z"/>
    <path d="M130 132 Q140 116 151 120 Q156 126 154 146 L145 146 Q147 132 145 130 L136 140 Z"/>
    <path d="M132 108 Q144 112 150 124 L145 128 Q137 120 129 118 Z"/>
    <path d="M143 143 L158 143 L158 148 L143 148 Z"/>
  </g>
