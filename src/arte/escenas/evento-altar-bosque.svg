  <path d="M130 80 Q124 64 134 50 Q144 36 136 22 M160 78 Q168 62 158 46 Q150 32 162 16 M188 80 Q196 66 186 52 Q178 40 188 28" fill="none" stroke="#a8e070" stroke-width="5" opacity="0.5" filter="url(#brillo)"/>
  <path d="M130 80 Q124 64 134 50 Q144 36 136 22 M160 78 Q168 62 158 46 Q150 32 162 16 M188 80 Q196 66 186 52 Q178 40 188 28" fill="none" stroke="#d8ffa8" stroke-width="1.2" stroke-linecap="round"/>
