  <path d="M150 60 Q148 38 170 34 Q192 38 190 62 Q200 80 204 104 Q208 130 196 150 Q188 140 182 154 Q176 142 168 158 Q160 144 152 152 Q148 138 140 146 Q134 120 142 96 Q146 78 150 60 Z M188 72 Q214 78 236 88 L240 98 Q212 94 190 92 Z" fill="#9af0ff" opacity="0.5" filter="url(#brillo)"/>
  <!-- spirit: translucent body -->
  <path d="M150 60 Q148 38 170 34 Q192 38 190 62 Q200 80 204 104 Q208 130 196 150 Q188 140 182 154 Q176 142 168 158 Q160 144 152 152 Q148 138 140 146 Q134 120 142 96 Q146 78 150 60 Z" fill="#b8f0f4" fill-opacity="0.32" stroke="#140d0a" stroke-width="2" stroke-opacity="0.8" stroke-linejoin="round"/>
  <path d="M184 56 Q200 80 204 104 Q208 130 196 150 Q188 140 182 154 Q190 110 184 56 Z" fill="#2a5a6a" fill-opacity="0.35"/>
  <path d="M152 58 Q150 42 166 37" fill="none" stroke="#e8ffff" stroke-width="1.6" opacity="0.8"/>
  <path d="M146 90 Q142 110 144 136 M158 96 Q156 120 160 146 M176 100 Q180 124 178 148" fill="none" stroke="#d8ffff" stroke-width="0.9" opacity="0.5"/>
  <!-- limp arm hanging at its side -->
  <path d="M152 72 Q138 96 140 120 L146 122 Q146 100 158 80 Z" fill="#b8f0f4" fill-opacity="0.3" stroke="#140d0a" stroke-width="1.4" stroke-opacity="0.7" stroke-linejoin="round"/>
  <path d="M140 120 L136 130 M142 121 L140 132 M145 122 L145 131" stroke="#140d0a" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- extended begging arm, palm up -->
  <path d="M188 72 Q214 78 234 88 L238 98 Q212 94 190 92 Z" fill="#b8f0f4" fill-opacity="0.36" stroke="#140d0a" stroke-width="2" stroke-opacity="0.8" stroke-linejoin="round"/>
  <path d="M234 88 Q244 86 254 90 L262 90 Q264 93 256 94 L262 96 Q262 99 254 98 L258 101 Q256 104 248 101 Q242 102 238 98 Z" fill="#c8f6f8" fill-opacity="0.45" stroke="#140d0a" stroke-width="1.6" stroke-opacity="0.8" stroke-linejoin="round"/>
  <path d="M236 88 L244 86" stroke="#e8ffff" stroke-width="1" opacity="0.8"/>
  <path d="M192 90 Q214 92 236 97" fill="none" stroke="#2a5a6a" stroke-width="1" opacity="0.6"/>

  <!-- gaunt face -->
  <path d="M158 48 Q164 42 168 50 Q164 58 158 54 Z M172 50 Q176 42 182 48 Q182 54 176 58 Z" fill="#0a1a22" stroke="#140d0a" stroke-width="1"/>
  <path d="M170 60 Q164 64 166 76 Q170 82 174 76 Q176 64 170 60 Z" fill="#0a1a22" stroke="#140d0a" stroke-width="1"/>
  <path d="M158 60 Q160 68 164 72 M182 60 Q180 68 176 72 M168 46 Q170 42 172 46" fill="none" stroke="#2a5a6a" stroke-width="0.9"/>
  <!-- tattered shroud over the head -->
  <path d="M144 76 Q138 40 170 26 Q202 40 198 76 L194 70 L192 78 Q192 56 186 46 Q180 38 170 38 Q158 38 154 48 Q148 58 150 78 L148 70 Z" fill="#5a98a6" fill-opacity="0.45" stroke="#140d0a" stroke-width="1.8" stroke-opacity="0.8" stroke-linejoin="round"/>
  <path d="M146 60 Q146 38 168 29" fill="none" stroke="#e8ffff" stroke-width="1.2" opacity="0.7"/>
  <path d="M190 44 Q198 58 196 72" fill="none" stroke="#1a3a46" stroke-width="1" opacity="0.7"/>

  <!-- pale cyan glowing eyes -->
  <circle cx="163.5" cy="51" r="4" fill="#9af0ff" filter="url(#suave)"/>
  <circle cx="176.5" cy="51" r="4" fill="#9af0ff" filter="url(#suave)"/>
  <circle cx="163.5" cy="51" r="1.8" fill="#f0ffff"/>
  <circle cx="176.5" cy="51" r="1.8" fill="#f0ffff"/>

  <!-- wisps trailing from the hem -->
  <path d="M146 150 Q140 162 128 166 M168 158 Q166 168 154 174 M194 152 Q204 160 214 162" fill="none" stroke="#9af0ff" stroke-width="3" opacity="0.4" filter="url(#suave)"/>
  <path d="M146 150 Q140 162 128 166 M168 158 Q166 168 154 174 M194 152 Q204 160 214 162" fill="none" stroke="#d8ffff" stroke-width="0.9" opacity="0.7"/>

  <rect width="320" height="180" fill="url(#vineta)"/>
</svg>
