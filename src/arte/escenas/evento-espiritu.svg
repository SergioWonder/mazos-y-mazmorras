  <path d="M150 140 L150 110 Q162 96 174 110 L174 140 Z" fill="#3a4852" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M162 102 Q174 106 174 140 L166 140 Q168 114 162 102 Z" fill="#26323a"/>
  <path d="M160 116 L160 130 M154 121 L166 121" stroke="#140d0a" stroke-width="1.2"/>

