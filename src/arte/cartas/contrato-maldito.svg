<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#381c50"/>
      <stop offset="1" stop-color="#11071c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#ff7a5a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.76">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.68"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- crypt interior: arches and candles -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M0 0 L280 0 L280 110 L0 110 Z" fill="#1c0e2a"/>
  <path d="M30 110 L30 50 Q60 14 90 50 L90 110 Z M190 110 L190 50 Q220 14 250 50 L250 110 Z" fill="#2a1640" stroke="#140d0a" stroke-width="2"/>
  <path d="M42 110 L42 56 Q60 32 78 56 L78 110 Z M202 110 L202 56 Q220 32 238 56 L238 110 Z" fill="#11071c"/>
  <!-- candles -->
  <g stroke="#140d0a" stroke-width="1.4">
    <rect x="56" y="88" width="8" height="22" fill="#d8c8a8"/>
    <rect x="216" y="92" width="8" height="18" fill="#d8c8a8"/>
  </g>
  <g>
    <ellipse cx="60" cy="83" rx="5" ry="8" fill="#ffb060" opacity="0.7" filter="url(#brillo)"/>
    <path d="M60 76 Q64 83 60 88 Q56 83 60 76 Z" fill="#ffe0a0"/>
    <ellipse cx="220" cy="87" rx="5" ry="8" fill="#ffb060" opacity="0.7" filter="url(#brillo)"/>
    <path d="M220 80 Q224 87 220 92 Q216 87 220 80 Z" fill="#ffe0a0"/>
  </g>
  <rect width="280" height="160" fill="url(#halo)"/>

  <!-- stone table -->
  <path d="M20 112 L260 112 L270 124 L10 124 Z" fill="#2c1e30" stroke="#140d0a" stroke-width="2"/>
  <path d="M10 124 L270 124 L270 160 L10 160 Z" fill="#170c1c"/>

  <!-- the parchment contract -->
  <path d="M96 36 Q140 30 184 36 L190 112 Q140 118 90 112 Z" fill="#c9b48a" stroke="#140d0a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M150 34 Q170 33 184 36 L190 112 Q172 115 156 116 Q178 80 150 34 Z" fill="#a8946c"/>
  <path d="M90 112 Q84 118 92 122 Q140 128 190 120 Q196 116 190 112" fill="#b09c72" stroke="#140d0a" stroke-width="2"/>
  <g stroke="#5a4630" stroke-width="1.1" stroke-linecap="round">
    <path d="M106 48 L170 46 M106 56 L174 55 M106 64 L162 63 M106 72 L172 72 M106 80 L150 80"/>
  </g>
  <!-- infernal seal -->
  <circle cx="158" cy="96" r="9" fill="#8a1a22" stroke="#140d0a" stroke-width="1.6"/>
  <path d="M152 92 L158 102 L164 92 Z" fill="none" stroke="#e05a4a" stroke-width="1.2"/>

  <!-- glowing blood signature -->
  <path d="M104 100 Q112 90 118 100 Q124 110 130 96 Q134 88 140 100" fill="none" stroke="#ff4a3a" stroke-width="4" opacity="0.7" filter="url(#brillo)"/>
  <path d="M104 100 Q112 90 118 100 Q124 110 130 96 Q134 88 140 100" fill="none" stroke="#ffb0a0" stroke-width="1.3" stroke-linecap="round"/>

  <!-- the warlock's hand with the quill (silhouette, violet rim) -->
  <g transform="translate(1.2 -1.2)" fill="#c98bff" opacity="0.85">
    <path d="M140 100 Q150 96 160 104 L200 140 L180 160 L148 118 Q138 110 140 100 Z"/>
  </g>
  <g fill="#0b0910">
    <path d="M140 100 Q150 96 160 104 L200 140 L180 160 L148 118 Q138 110 140 100 Z"/>
    <path d="M142 102 Q138 96 144 94 L152 100 Z"/>
  </g>
  <path d="M141 99 L176 60 Q182 56 184 60 Q170 80 144 102 Z" fill="#e8dcc8" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M150 90 L178 62" stroke="#8a7a68" stroke-width="0.8"/>

  <!-- the patron's clawed hand offering the deal -->
  <g stroke="#140d0a" stroke-width="2" stroke-linejoin="round">
    <path d="M280 70 L230 78 Q214 80 206 72 L196 64 Q194 60 198 60 L210 66 L204 54 Q204 50 208 52 L216 62 L214 48 Q216 44 220 48 L224 62 L228 52 Q232 50 232 54 L232 68 L280 58 Z" fill="#5a2436"/>
    <path d="M198 60 L192 58 M208 52 L204 46 M220 48 L220 42 M232 54 L234 48" fill="none" stroke="#e0d4c0" stroke-width="1.6"/>
  </g>
  <path d="M280 62 L236 70 Q230 72 228 66" fill="none" stroke="#3a1422" stroke-width="1"/>
  <circle cx="186" cy="64" r="2" fill="#ff6a4a" filter="url(#suave)"/>

  <g fill="#ffb070" opacity="0.8">
    <circle cx="120" cy="30" r="0.9"/><circle cx="200" cy="30" r="1"/><circle cx="84" cy="70" r="0.9"/>
  </g>
  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
