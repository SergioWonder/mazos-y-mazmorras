<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1624"/>
      <stop offset="1" stop-color="#0e0609"/>
    </linearGradient>
    <radialGradient id="vela" cx="0.16" cy="0.38" r="0.4">
      <stop offset="0" stop-color="#ffb060" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.55" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#e04a4a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e04a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pergamino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d2a8"/>
      <stop offset="1" stop-color="#bba878"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- estudio del prestamista infernal -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <rect width="280" height="160" fill="url(#vela)"/>
  <!-- estantes con frascos y calaveras -->
  <path d="M150 30 L280 30 M150 62 L280 62" stroke="#1a0c12" stroke-width="4"/>
  <path d="M160 30 L162 14 L172 14 L174 30 Z M182 30 Q180 18 190 18 Q200 18 198 30 Z M232 30 L234 20 L246 20 L248 30 Z M210 62 Q208 48 220 48 Q232 48 230 62 Z M170 62 L172 50 L180 50 L182 62 Z M252 62 L254 44 L264 44 L266 62 Z" fill="#241218"/>
  <circle cx="190" cy="23" r="1.4" fill="#e04a4a" opacity="0.6"/>
  <circle cx="216" cy="53" r="1.4" fill="#e04a4a" opacity="0.6"/>
  <circle cx="224" cy="53" r="1.4" fill="#e04a4a" opacity="0.6"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <!-- mesa -->
  <path d="M0 100 L280 94 L280 160 L0 160 Z" fill="#2a1612"/>
  <path d="M0 100 L280 94" stroke="#140d0a" stroke-width="2"/>
  <path d="M0 116 L280 110 M0 136 L280 130" stroke="#1e0e0c" stroke-width="1"/>

  <!-- vela -->
  <path d="M30 104 L30 68 Q36 64 42 68 L42 104 Z" fill="#d8c8a8" stroke="#140d0a" stroke-width="1.8"/>
  <path d="M38 70 L38 104" stroke="#b0a080" stroke-width="3"/>
  <path d="M30 76 Q27 84 30 88" fill="none" stroke="#d8c8a8" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 104 L46 104 L48 108 L24 108 Z" fill="#4a3424" stroke="#140d0a" stroke-width="1.4"/>
  <ellipse cx="36" cy="58" rx="8" ry="12" fill="#ffb060" opacity="0.8" filter="url(#brillo)"/>
  <path d="M36 46 Q42 56 38 64 Q36 66 34 64 Q30 56 36 46 Z" fill="#ffd27a"/>
  <path d="M36 54 Q38 60 36 63 Q35 60 36 54 Z" fill="#fff4d0"/>
  <path d="M36 66 L36 69" stroke="#140d0a" stroke-width="1.2"/>

  <!-- el pagaré desenrollado -->
  <path d="M70 118 Q66 88 78 70 L176 60 Q186 84 182 112 Z" fill="url(#pergamino)" stroke="#140d0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M170 62 Q182 84 178 110 L182 112 Q186 84 176 60 Z" fill="#9a8a5c"/>
  <path d="M64 124 Q60 112 70 110 L184 104 Q194 106 190 116 Q186 122 176 122 Z" fill="#cdbb8c" stroke="#140d0a" stroke-width="2"/>
  <path d="M72 74 Q66 68 72 64 L82 66 Q76 70 78 76 Z" fill="#cdbb8c" stroke="#140d0a" stroke-width="1.6"/>
  <!-- renglones ilegibles -->
  <path d="M86 76 Q100 73 112 76 T140 74 T166 71 M86 84 Q98 81 110 84 T136 82 T162 80 M88 92 Q104 89 118 92 T150 89 M88 100 Q100 97 114 100" fill="none" stroke="#5a4a32" stroke-width="1.2" stroke-linecap="round"/>
  <!-- firma en sangre -->
  <path d="M120 106 Q126 96 132 104 Q136 110 142 100 Q148 94 150 104 Q154 110 162 102" fill="none" stroke="#9a1a22" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M146 104 Q145 110 147 113" stroke="#9a1a22" stroke-width="1.6" stroke-linecap="round"/>
  <!-- sello de lacre -->
  <circle cx="98" cy="108" r="10" fill="#e04a4a" opacity="0.6" filter="url(#brillo)"/>
  <path d="M90 104 Q88 98 96 98 Q100 94 104 99 Q110 100 108 106 Q110 112 104 114 Q100 118 94 114 Q88 112 90 104 Z" fill="#8a1a20" stroke="#140d0a" stroke-width="1.6"/>
  <path d="M94 104 L102 104 L98 111 Z" fill="none" stroke="#e0606a" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="98" cy="106" r="1.2" fill="#e0606a"/>

  <!-- mano de diablo con la pluma que gotea -->
  <path d="M280 52 Q252 56 232 70 L224 76 L230 90 Q248 84 280 84 Z" fill="#7a2a2a" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M280 72 Q256 76 234 86 L230 90 Q248 84 280 84 Z" fill="#5a1c1e"/>
  <path d="M254 62 Q262 64 270 62 M250 70 L262 70" stroke="#4a1416" stroke-width="0.9" fill="none"/>
  <!-- dedos con uñas negras -->
  <path d="M226 76 Q214 74 206 78 M228 82 Q216 84 210 90 M230 88 Q222 94 220 100" fill="none" stroke="#140d0a" stroke-width="7" stroke-linecap="round"/>
  <path d="M226 76 Q214 74 206 78 M228 82 Q216 84 210 90 M230 88 Q222 94 220 100" fill="none" stroke="#7a2a2a" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M206 78 L200 80 M210 90 L204 94 M220 100 L218 106" stroke="#140d0a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- pluma -->
  <path d="M238 34 Q224 44 214 60 Q206 74 196 96 Q208 76 222 62 Q236 48 238 34 Z" fill="#1c1418" stroke="#140d0a" stroke-width="1.6"/>
  <path d="M236 38 Q222 56 200 92" stroke="#3a2e36" stroke-width="0.9" fill="none"/>
  <path d="M196 96 L192 104" stroke="#140d0a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M192 104 Q190 110 192 113 Q195 110 192 104 Z" fill="#b01e28" stroke="#140d0a" stroke-width="0.8"/>
  <circle cx="192" cy="118" r="1.6" fill="#b01e28"/>

  <!-- gotas en la mesa -->
  <ellipse cx="194" cy="124" rx="4" ry="1.4" fill="#6a0e14"/>
  <ellipse cx="206" cy="128" rx="2.4" ry="1" fill="#6a0e14"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
