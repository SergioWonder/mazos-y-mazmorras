<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.42" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.64"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- paladin facing us, both hands on the hammer, cape torn by the wind -->
    <g id="h">
      <path d="M-14 -56 Q-30 -40 -46 -8 Q-38 -3 -31 -9 Q-26 -2 -20 -4 Q-18 0 -14 0 H14 Q20 -30 14 -56 Z"/>
      <path d="M-10 -26 H-2 L-3 -12 L-4 0 H-13 L-11 -12 Z M2 -26 H10 L11 -12 L13 0 H4 L3 -12 Z"/>
      <path d="M-11 -36 H11 L13 -24 H-13 Z"/>
      <path d="M-11 -58 Q0 -62 11 -58 Q13 -46 10 -35 H-10 Q-13 -46 -11 -58 Z"/>
      <path d="M-9 -61 Q-22 -63 -22 -50 Q-15 -48 -9 -52 Z M9 -61 Q22 -63 22 -50 Q15 -48 9 -52 Z"/>
      <path d="M-6 -71 Q-6 -77 0 -77 Q6 -77 6 -71 L6.5 -61 Q0 -58.5 -6.5 -61 Z"/>
      <path d="M-1 -76 Q-9 -85 -20 -81 Q-11 -78 -4 -72 Z"/>
      <path d="M-15 -54 L-21 -51 L-10 -30 L-4 -31 Z M15 -54 L21 -51 L10 -30 L4 -31 Z"/>
      <path d="M-6.5 -34 H6.5 V-27 H-6.5 Z"/>
    </g>
  </defs>

  <!-- snowbound mountain pass at night -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M0 90 L30 60 L48 72 L76 40 L104 70 L120 62 L150 86 V120 H0 Z" fill="#33280f"/>
  <path d="M150 96 L184 54 L204 70 L232 36 L262 66 L280 58 V120 H150 Z" fill="#2c220e"/>
  <path d="M76 40 L84 50 L78 48 L72 54 L66 50 Z M232 36 L240 46 L234 44 L228 50 L222 46 Z M30 60 L36 68 L28 66 Z M184 54 L190 62 L182 60 Z" fill="#a89a78"/>
  <!-- ruined wayside shrine -->
  <path d="M206 124 V78 Q226 58 246 78 V124 H238 V82 Q226 70 214 82 V124 Z" fill="#221a0b" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M204 78 Q226 56 248 78 L244 78 Q226 62 208 78 Z" fill="#a89a78"/>
  <path d="M252 124 V94 H262 V124 Z" fill="#221a0b" stroke="#140d0a" stroke-width="1.2"/>
  <path d="M251 94 H263 V91 H251 Z" fill="#a89a78"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <path d="M0 122 Q70 112 140 118 T280 116 V160 H0 Z" fill="#4a4030"/>
  <path d="M0 122 Q70 112 140 118 T280 116" fill="none" stroke="#a89a78" stroke-width="2"/>
  <path d="M0 136 Q90 128 180 134 T280 132 V160 H0 Z" fill="#2c261a"/>

  <!-- the paladin stands firm in the blizzard -->
  <use href="#h" transform="translate(119.6 150.4) scale(1.4)" fill="#ffd35a" opacity="0.95"/>
  <use href="#h" transform="translate(118 152) scale(1.4)" fill="#0b0910"/>
  <path d="M113.5 57.5 H122.5 M118 55 V62" stroke="#ffd35a" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <!-- the hammer planted head-down -->
  <path d="M118 97 V142" stroke="#140d0a" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M118 97 V142" stroke="#4a3420" stroke-width="3" stroke-linecap="round"/>
  <path d="M118 104 V114" stroke="#0b0910" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="98" r="3" fill="#0b0910"/>
  <path d="M104 140 H132 V154 H104 Z" fill="#4a5056" stroke="#140d0a" stroke-width="1.6"/>
  <path d="M118 140 H132 V154 H118 Z" fill="#363b40"/>
  <path d="M106 142 H116" stroke="#ffd35a" stroke-width="1" opacity="0.7"/>

  <!-- the votive flame burning in the chest -->
  <g transform="translate(118 87) scale(0.85) translate(-118 -84)">
  <circle cx="118" cy="84" r="24" fill="#ffd35a" opacity="0.6" filter="url(#fuerte)"/>
  <path d="M104 84 L94 80 M132 84 L142 80 M108 94 L100 100 M128 94 L136 100 M118 70 V64" stroke="#ffe89a" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M118 66 Q128 78 126 88 Q124 96 118 96 Q112 96 110 88 Q108 78 118 66 Z" fill="#ffb040" opacity="0.8" filter="url(#brillo)"/>
  <path d="M118 68 Q127 79 125 88 Q123 95 118 95 Q113 95 111 88 Q109 80 114 75 Q115 80 117 81 Q115 74 118 68 Z" fill="#ffd35a" stroke="#140d0a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M118 76 Q123 83 122 89 Q121 93 118 93 Q115 93 114.5 89 Q114 84 118 76 Z" fill="#fff0b0"/>
  <path d="M118 84 Q120 88 119.5 91 Q118 92 116.6 91 Q116.5 88 118 84 Z" fill="#fffaf0"/>
  </g>

  <!-- driving snow -->
  <g stroke="#e8e0cc" stroke-linecap="round" opacity="0.75">
    <path d="M262 30 L248 36 M230 58 L216 64 M196 20 L182 26 M270 90 L256 96 M180 100 L166 106 M160 40 L146 46 M90 26 L76 32 M60 70 L46 76 M40 110 L26 116 M250 120 L236 126 M212 104 L198 110" stroke-width="1.2"/>
  </g>
  <g fill="#f0e8d4">
    <circle cx="240" cy="48" r="1.2"/><circle cx="206" cy="40" r="1"/><circle cx="170" cy="70" r="1.3"/><circle cx="150" cy="24" r="1"/><circle cx="94" cy="48" r="1.2"/><circle cx="70" cy="96" r="1"/><circle cx="30" cy="42" r="1.3"/><circle cx="20" cy="84" r="1"/><circle cx="190" cy="84" r="1.1"/><circle cx="226" cy="100" r="1.3"/><circle cx="264" cy="70" r="1"/><circle cx="160" cy="112" r="1.2"/><circle cx="54" cy="124" r="1"/><circle cx="110" cy="30" r="0.9"/>
  </g>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
