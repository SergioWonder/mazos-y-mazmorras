    <path d="M72 106 Q70 92 78 80 Q86 75 93 82 Q93 95 82 106 Z"/>
    <circle cx="89" cy="70" r="8.5"/>
    <path d="M83 64 Q81 55 88 58 Z"/>
    <path d="M68 101 L75 108 L47 128 L38 128 L40 124 Z"/>
