<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4436"/>
      <stop offset="1" stop-color="#1c1812"/>
    </linearGradient>
    <radialGradient id="incendio" cx="0.82" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#ff8a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.52" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5f7"/>
      <stop offset="1" stop-color="#8a959e"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- noche sobre el asentamiento en llamas -->
  <rect width="280" height="160" fill="url(#cielo)"/>
