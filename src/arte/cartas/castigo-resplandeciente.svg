      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.78" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
