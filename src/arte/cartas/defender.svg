<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4436"/>
      <stop offset="1" stop-color="#1c1812"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.38" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c6ccd2"/>
      <stop offset="1" stop-color="#6c747b"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- colina al atardecer con arqueros goblin en la cresta -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M150 104 Q200 84 280 90 L280 160 L150 160 Z" fill="#2a231a"/>
  <g fill="#1a150f">
