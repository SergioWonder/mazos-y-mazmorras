    <path d="M254 82 Q262 74 266 76 Q260 82 254 86 Z"/>
    <path d="M250 84 Q260 72 260 94" fill="none" stroke="#1a150f" stroke-width="1.4"/>
  </g>
  <circle cx="211" cy="82" r="1" fill="#ffd75a"/>
  <circle cx="249" cy="84" r="1" fill="#ffd75a"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <path d="M0 130 Q90 122 170 128 T280 132 L280 160 L0 160 Z" fill="#15110c"/>
  <path d="M20 131 L24 124 M30 132 L33 126 M140 128 L144 121 M150 129 L152 123" stroke="#2c241a" stroke-width="1.2"/>

  <!-- flechas que llegan y rebotan -->
  <g stroke-linecap="round">
    <path d="M200 60 L150 72" stroke="#140d0a" stroke-width="3"/>
    <path d="M200 60 L150 72" stroke="#6b4a30" stroke-width="1.6"/>
    <path d="M148 72.5 L155 68 L154 74.5 Z" fill="#8d9297" stroke="#140d0a" stroke-width="0.8"/>
    <path d="M200 60 L205 56 M200 60 L206 62" stroke="#8a2e24" stroke-width="1.6"/>
    <path d="M232 70 L196 50" stroke="#6b4a30" stroke-width="1.4" opacity="0.8"/>
    <path d="M124 38 L108 22" stroke="#140d0a" stroke-width="2.6"/>
    <path d="M124 38 L108 22" stroke="#6b4a30" stroke-width="1.3"/>
    <path d="M136 112 L152 124" stroke="#140d0a" stroke-width="2.6"/>
    <path d="M136 112 L152 124" stroke="#6b4a30" stroke-width="1.3"/>
  </g>

  <!-- héroe agachado tras el escudo -->
  <g transform="translate(1.4 -1.4)" fill="#ffd9a0" opacity="0.9">
    <path d="M58 132 Q48 112 56 96 Q62 86 74 88 Q84 92 84 106 L92 132 Z"/>
    <circle cx="70" cy="82" r="8"/>
  </g>
  <g fill="#0b0910">
    <path d="M58 132 Q48 112 56 96 Q62 86 74 88 Q84 92 84 106 L92 132 Z"/>
    <circle cx="70" cy="82" r="8"/>
    <path d="M64 78 Q60 70 67 72 Z"/>
    <path d="M40 132 Q44 118 56 112 L60 120 Q52 126 52 132 Z"/>
  </g>

  <!-- gran escudo redondo -->
  <ellipse cx="100" cy="92" rx="34" ry="37" fill="#140d0a"/>
  <ellipse cx="100" cy="92" rx="31.5" ry="34.5" fill="url(#metal)"/>
  <ellipse cx="101" cy="93" rx="26" ry="29" fill="#6a4a2e" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M112 66 Q126 80 124 100 Q120 116 106 121 Q118 102 112 66 Z" fill="#553a22"/>
  <path d="M88 66 L86 120 M101 64 L101 122 M114 67 L116 119" stroke="#140d0a" stroke-width="0.9" opacity="0.8"/>
  <path d="M82 80 L90 80 L101 70 L112 80 L120 80 L114 94 L118 108 L101 102 L84 108 L88 94 Z" fill="#8a2e24" stroke="#140d0a" stroke-width="1.3"/>
  <path d="M101 70 L112 80 L120 80 L114 94 L118 108 L101 102 Z" fill="#6e2018"/>
  <circle cx="101" cy="92" r="6" fill="url(#metal)" stroke="#140d0a" stroke-width="1.6"/>
  <circle cx="99" cy="90" r="1.8" fill="#f2f5f7"/>
  <path d="M74 70 Q82 60 94 58" fill="none" stroke="#f2f5f7" stroke-width="1.6" opacity="0.7"/>
  <circle cx="76" cy="92" r="1.5" fill="#c6ccd2" stroke="#140d0a" stroke-width="0.6"/>
  <circle cx="124" cy="92" r="1.5" fill="#c6ccd2" stroke="#140d0a" stroke-width="0.6"/>
  <circle cx="100" cy="60" r="1.5" fill="#c6ccd2" stroke="#140d0a" stroke-width="0.6"/>
  <circle cx="100" cy="125" r="1.5" fill="#c6ccd2" stroke="#140d0a" stroke-width="0.6"/>

  <!-- chispas del impacto en el borde -->
