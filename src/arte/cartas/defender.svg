  <path d="M132 74 L140 70 M132 74 L141 77 M132 74 L137 66 M132 74 L138 82" stroke="#fff4d6" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="132" cy="74" r="2.2" fill="#fffaf0"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
