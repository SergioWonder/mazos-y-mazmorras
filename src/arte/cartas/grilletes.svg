  <circle cx="246" cy="84" r="7" fill="none" stroke="url(#hierro)" stroke-width="3"/>
  <path d="M240 80 L252 80 L252 74 L240 74 Z" fill="#3e3e46" stroke="#140d0a" stroke-width="1.4"/>
