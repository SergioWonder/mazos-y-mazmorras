    <ellipse cx="232" cy="106" rx="6" ry="4" transform="rotate(20 232 106)"/>
    <ellipse cx="222" cy="114" rx="4" ry="6" transform="rotate(50 222 114)"/>
    <ellipse cx="210" cy="120" rx="6" ry="4" transform="rotate(10 210 120)"/>
    <ellipse cx="196" cy="124" rx="4" ry="6" transform="rotate(80 196 124)"/>
  </g>

