  <path d="M190 14 L230 14 L230 44 L190 44 Z" fill="#3a3a5a" stroke="#140d0a" stroke-width="2"/>
  <path d="M200 14 L200 44 M210 14 L210 44 M220 14 L220 44" stroke="#140d0a" stroke-width="2.4"/>
  <path d="M190 44 L230 44 L170 140 L90 140 Z" fill="url(#haz)"/>
  <rect width="280" height="160" fill="url(#antorcha)"/>
