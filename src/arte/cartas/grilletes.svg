<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2430"/>
      <stop offset="1" stop-color="#0e0c12"/>
    </linearGradient>
    <radialGradient id="antorcha" cx="0.08" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ff9a50" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff9a50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8c8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c8c8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hierro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a92"/>
      <stop offset="1" stop-color="#3e3e46"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- celda de la mazmorra -->
  <rect width="280" height="160" fill="url(#cielo)"/>
