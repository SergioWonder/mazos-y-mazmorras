  <path d="M74 132 Q78 134 80 132 M126 106 Q130 108 134 104" stroke="#8a4a2a" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- rata que husmea -->
  <path d="M36 140 Q40 130 50 132 Q58 134 58 140 Z" fill="#2a2228" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M36 140 Q30 138 32 134 L38 136" fill="#2a2228" stroke="#140d0a" stroke-width="1.2"/>
