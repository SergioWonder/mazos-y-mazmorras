    <ellipse cx="150" cy="126" rx="3.6" ry="5"/>
    <ellipse cx="140" cy="127" rx="5" ry="3.6"/>
    <ellipse cx="130" cy="127" rx="3.6" ry="5"/>
    <ellipse cx="120" cy="126" rx="5" ry="3.6"/>
    <ellipse cx="110" cy="124" rx="3.6" ry="5"/>
