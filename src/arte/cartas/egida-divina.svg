<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <linearGradient id="alba" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.42">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pluma" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffe89a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d6dce2"/>
      <stop offset="1" stop-color="#6c747b"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- left wing of light; the right one is its mirror -->
    <g id="ala">
      <path d="M120 66 Q92 34 34 30 Q54 42 62 48 Q40 48 22 56 Q46 60 56 64 Q36 68 24 80 Q50 78 60 80 Q46 88 40 102 Q64 90 76 90 Q70 98 68 112 Q86 96 98 92 Q102 98 104 108 Q110 92 120 84 Z" fill="#ffd35a" opacity="0.6" filter="url(#brillo)"/>
      <path d="M120 66 Q92 34 34 30 Q54 42 62 48 Q40 48 22 56 Q46 60 56 64 Q36 68 24 80 Q50 78 60 80 Q46 88 40 102 Q64 90 76 90 Q70 98 68 112 Q86 96 98 92 Q102 98 104 108 Q110 92 120 84 Z" fill="url(#pluma)" stroke="#fff3c4" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M118 70 Q86 48 50 40 M118 72 Q80 60 42 56 M118 76 Q82 72 44 78 M118 78 Q86 84 58 94 M118 80 Q96 90 82 104" fill="none" stroke="#e0a632" stroke-width="1" opacity="0.8"/>
      <path d="M118 66 Q100 48 80 42 Q100 56 106 66 Q96 66 86 70 Q104 72 118 74 Z" fill="#fffaf0" opacity="0.8"/>
    </g>
  </defs>

  <!-- dawn above the sea of clouds -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <rect y="40" width="280" height="80" fill="url(#alba)"/>
  <path d="M0 98 L30 84 L44 90 L70 76 L92 92 L100 88 V110 H0 Z M200 110 V86 L222 72 L240 84 L258 78 L280 90 V110 Z" fill="#2c2211"/>
  <path d="M0 108 Q20 100 44 104 Q60 96 84 102 Q110 96 130 104 Q156 98 180 104 Q206 96 230 104 Q256 98 280 104 V124 H0 Z" fill="#6a5634" opacity="0.8"/>
  <path d="M0 116 Q30 110 60 114 Q90 108 120 114 Q160 108 200 114 Q240 108 280 114 V130 H0 Z" fill="#8a7248" opacity="0.6"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <circle cx="140" cy="74" r="40" fill="#ffe89a" opacity="0.35" filter="url(#fuerte)"/>

  <!-- the wings unfold -->
  <use href="#ala"/>
  <use href="#ala" transform="translate(280 0) scale(-1 1)"/>

  <!-- volley of black arrows breaking on the wings -->
  <g stroke-linecap="round">
    <path d="M264 2 L228 30 M232 0 L203 36 M20 2 L52 32" stroke="#140d0a" stroke-width="2.8"/>
    <path d="M264 2 L228 30 M232 0 L203 36 M20 2 L52 32" stroke="#4a3624" stroke-width="1.4"/>
    <path d="M226 31.5 L229 25.5 L233 30 Z M201 38.5 L202.5 32 L207.5 35.5 Z M54 34 L47.5 32 L51.5 27.5 Z" fill="#3a3a3a" stroke="#140d0a" stroke-width="0.8"/>
    <path d="M264 2 L270 2 M264 2 L264 -4 M20 2 L14 2" stroke="#6e2018" stroke-width="1.6"/>
    <path d="M236 116 L244 128 M246 112 L258 116 M36 116 L30 128 M216 122 L218 132" stroke="#140d0a" stroke-width="2.4"/>
    <path d="M236 116 L244 128 M246 112 L258 116 M36 116 L30 128 M216 122 L218 132" stroke="#4a3624" stroke-width="1.1"/>
  </g>
  <g fill="#fff4d6">
    <circle cx="227" cy="31" r="5" opacity="0.9" filter="url(#brillo)"/><circle cx="202" cy="37" r="5" opacity="0.9" filter="url(#brillo)"/><circle cx="53" cy="33" r="5" opacity="0.9" filter="url(#brillo)"/>
  </g>
  <path d="M227 31 L233 36 M227 31 L222 26 M202 37 L208 41 M202 37 L198 31 M53 33 L47 37 M53 33 L58 28" stroke="#fffaf0" stroke-width="1.3" stroke-linecap="round"/>

  <!-- rocky summit where the shield is planted -->
  <path d="M52 160 L84 128 L106 124 L124 116 L156 116 L176 122 L200 128 L236 160 Z" fill="#2a200e" stroke="#140d0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M156 116 L176 122 L200 128 L236 160 H172 L166 136 Z" fill="#1d1609"/>
  <path d="M84 128 L106 124 L124 116 L132 118 L112 128 Z" fill="#3e3014"/>
  <path d="M130 118 L124 128 L128 136 M150 118 L156 128 M140 120 L140 132" fill="none" stroke="#140d0a" stroke-width="1.2"/>

  <!-- paladin kneeling behind the shield, head bowed -->
  <g transform="translate(1.2 -1.2)" fill="#ffd35a">
    <path d="M132 52 Q132 39 140 39 Q148 39 148 52 L148 58 H132 Z M138.5 39.5 Q140 31 144 29 Q143 35 141.5 39.5 Z M114 62 Q112 49 127 50 L134 57 Z M166 62 Q168 49 153 50 L146 57 Z M122 57 Q140 51 158 57 V62 H122 Z"/>
  </g>
  <g fill="#0b0910">
    <path d="M132 52 Q132 39 140 39 Q148 39 148 52 L148 58 H132 Z M138.5 39.5 Q140 31 144 29 Q143 35 141.5 39.5 Z M114 62 Q112 49 127 50 L134 57 Z M166 62 Q168 49 153 50 L146 57 Z M122 57 Q140 51 158 57 V62 H122 Z"/>
  </g>
  <path d="M135 48 H145" stroke="#ffd35a" stroke-width="1" stroke-linecap="round"/>

  <!-- the heater shield, tip driven into the rock -->
  <path d="M114 54 H166 Q168 92 140 120 Q112 92 114 54 Z" fill="#140d0a"/>
  <path d="M117 57 H163 Q164 90 140 115 Q116 90 117 57 Z" fill="url(#metal)"/>
  <path d="M140 57 H163 Q164 90 140 115 Z" fill="#5a6168" opacity="0.55"/>
  <path d="M117 57 H163 Q164 90 140 115 Q116 90 117 57 Z" fill="none" stroke="#e0a632" stroke-width="2.4"/>
  <path d="M121 61 H159 Q159 88 140 109 Q121 88 121 61 Z" fill="none" stroke="#140d0a" stroke-width="1"/>
  <circle cx="140" cy="80" r="11" fill="#ffd35a" opacity="0.7" filter="url(#brillo)"/>
  <circle cx="140" cy="80" r="7" fill="#ffd35a" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M140 67 V71 M140 89 V93 M127 80 H131 M149 80 H153 M131 71 L134 74 M149 71 L146 74 M131 89 L134 86 M149 89 L146 86" stroke="#ffd35a" stroke-width="2" stroke-linecap="round"/>
  <path d="M143 76 Q146 80 143 84" fill="none" stroke="#b07a1a" stroke-width="1.4"/>
  <path d="M121 62 Q128 58 138 58" fill="none" stroke="#f2f5f7" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="120" cy="58" r="1.4" fill="#e0a632"/><circle cx="160" cy="58" r="1.4" fill="#e0a632"/>
  <path d="M126 118 Q140 110 154 118" fill="none" stroke="#140d0a" stroke-width="2"/>

  <!-- gauntlets gripping the rim -->
  <path d="M116 54 Q116 49 121 49 Q126 50 125 56 Q121 59 116 54 Z M164 54 Q164 49 159 49 Q154 50 155 56 Q159 59 164 54 Z" fill="#ffd35a" transform="translate(1 -1)"/>
  <path d="M116 54 Q116 49 121 49 Q126 50 125 56 Q121 59 116 54 Z M164 54 Q164 49 159 49 Q154 50 155 56 Q159 59 164 54 Z" fill="#0b0910"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
