<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2846"/>
      <stop offset="0.7" stop-color="#1e1426"/>
      <stop offset="1" stop-color="#100a14"/>
    </linearGradient>
    <radialGradient id="ocaso" cx="0.5" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#c98bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c98bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="niebla" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- encrucijada al anochecer -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <rect width="280" height="160" fill="url(#ocaso)"/>
  <path d="M0 96 Q30 84 60 92 Q96 80 130 92 Q170 82 210 90 Q248 80 280 90 L280 112 L0 112 Z" fill="#1a1020"/>
  <path d="M0 108 Q70 100 140 106 Q210 100 280 106 L280 160 L0 160 Z" fill="#150d19"/>
  <!-- dos caminos que se separan -->
  <path d="M120 160 Q128 132 108 118 Q84 106 20 104 L40 102 Q96 102 118 112 Q138 124 150 160 Z" fill="#3a2c40"/>
  <path d="M150 160 Q146 132 170 118 Q196 106 262 102 L246 100 Q190 102 164 112 Q138 124 128 160 Z" fill="#33263a"/>
  <path d="M128 150 Q126 136 116 126 M146 150 Q148 136 160 126" stroke="#241a2a" stroke-width="1" fill="none"/>
  <!-- árbol seco -->
  <path d="M36 106 L40 64 Q30 52 22 50 M39 76 Q50 64 60 62 M40 66 Q42 52 48 44 M38 88 Q28 82 20 84" fill="none" stroke="#0e0812" stroke-width="3.2" stroke-linecap="round"/>

  <!-- poste indicador con los brazos contradictorios -->
  <path d="M186 124 L188 58" stroke="#140d0a" stroke-width="7" stroke-linecap="round"/>
  <path d="M186 124 L188 58" stroke="#4a3a2c" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M187 62 L189 120" stroke="#2e2218" stroke-width="1.2"/>
  <path d="M190 62 L226 58 L234 64 L226 70 L190 72 Z" fill="#5a4632" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M194 66 L222 64" stroke="#3a2c20" stroke-width="0.9"/>
  <path d="M186 76 L150 72 L142 79 L150 85 L186 86 Z" fill="#54402e" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M154 79 L182 80" stroke="#3a2c20" stroke-width="0.9"/>
  <!-- el tercer brazo cuelga roto -->
  <path d="M190 92 L194 90 L204 118 L198 121 Z" fill="#4e3a2a" stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M188 88 L193 91" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M195 96 L200 112" stroke="#3a2c20" stroke-width="0.8"/>

  <!-- héroe a contraluz, cabizbajo, con la mano en el mentón -->
  <g transform="translate(1.3 -1.3)" fill="#c98bff" opacity="0.9">
    <circle cx="124" cy="66" r="7"/>
    <path d="M114 74 Q124 70 134 74 L138 102 L110 102 Z"/>
    <path d="M112 100 L110 128 L116 128 L122 104 L126 104 L130 128 L136 128 L136 100 Z"/>
  </g>
  <g fill="#0b0910">
    <circle cx="124" cy="66" r="7"/>
    <path d="M114 74 Q124 70 134 74 L138 102 L110 102 Z"/>
    <path d="M112 100 L110 128 L116 128 L122 104 L126 104 L130 128 L136 128 L136 100 Z"/>
    <path d="M108 128 L118 128 L118 131 L106 131 Z M128 128 L138 128 L140 131 L128 131 Z"/>
    <path d="M134 78 Q142 84 136 92 Q132 84 126 74 Z"/>
    <path d="M128 74 Q134 84 128 90 L126 80 Z"/>
    <path d="M114 76 Q104 90 108 104 L112 102 Q110 90 118 80 Z"/>
    <path d="M117 60 Q124 54 131 60 L130 64 Q124 60 118 64 Z"/>
  </g>
  <!-- la mano sube al mentón -->
  <path d="M136 88 Q132 80 128 72" fill="none" stroke="#0b0910" stroke-width="5" stroke-linecap="round"/>

  <!-- susurros de sombra alrededor de la cabeza -->
  <path d="M96 52 Q106 40 118 46 Q108 50 104 60 M150 48 Q142 36 130 42 Q140 48 142 58 M98 78 Q88 70 92 60" fill="none" stroke="#6a3a8a" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#niebla)"/>
  <path d="M96 52 Q106 40 118 46 Q108 50 104 60 M150 48 Q142 36 130 42 Q140 48 142 58 M98 78 Q88 70 92 60" fill="none" stroke="#2a1638" stroke-width="2.4" stroke-linecap="round"/>
  <!-- ojos en la niebla -->
  <g fill="#e6b8ff">
    <circle cx="101" cy="47" r="1.2"/><circle cx="105" cy="46" r="1.2"/>
    <circle cx="146" cy="42" r="1.2"/><circle cx="150" cy="43" r="1.2"/>
    <circle cx="90" cy="66" r="1.1"/><circle cx="93" cy="64" r="1.1"/>
  </g>
  <g fill="#c98bff" opacity="0.6" filter="url(#brillo)">
    <circle cx="103" cy="46.5" r="3"/><circle cx="148" cy="42.5" r="3"/><circle cx="91.5" cy="65" r="2.6"/>
  </g>
  <!-- volutas de duda que se deshacen -->
  <path d="M120 40 Q124 34 128 38 Q130 42 126 44 M126 28 Q128 26 130 28" fill="none" stroke="#b890d0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- cuervo sobre el poste -->
  <path d="M184 56 Q186 48 192 48 Q198 48 198 54 L204 54 L198 57 Q192 60 184 56 Z" fill="#0b0910" stroke="#140d0a" stroke-width="1"/>
  <circle cx="194" cy="51" r="0.9" fill="#e6b8ff"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
