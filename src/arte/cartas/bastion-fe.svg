<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.56" r="0.42">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.45" stop-color="#ffe89a"/>
      <stop offset="1" stop-color="#e0a632"/>
    </radialGradient>
    <linearGradient id="abanico" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe89a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- goblin hauling the ram, facing right -->
    <g id="g">
      <path d="M-4 0 L-3 -9 M4 0 L3 -9" fill="none" stroke="#140d0a" stroke-width="5" stroke-linecap="round"/>
      <path d="M-4 0 L-3 -9 M4 0 L3 -9" fill="none" stroke="#6f7d4a" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-7 -8 Q-8 -18 0 -20 Q8 -19 7 -9 Q0 -5 -7 -8 Z" fill="#6f7d4a" stroke="#140d0a" stroke-width="1.6"/>
      <path d="M3 -19 Q8 -16 7 -9 Q3 -7 0 -7 Q5 -12 3 -19 Z" fill="#56613a"/>
      <path d="M-7 -9 Q0 -5 7 -9 L5 -5 H-5 Z" fill="#56422f" stroke="#140d0a" stroke-width="1"/>
      <path d="M0 -29 Q-9 -36 -13 -34 Q-8 -28 -1 -26 Z" fill="#56613a" stroke="#140d0a" stroke-width="1.2"/>
      <path d="M-2 -26 Q-2 -33 4 -33 Q10 -32 10 -26 Q9 -21 4 -21 Q-1 -21 -2 -26 Z" fill="#6f7d4a" stroke="#140d0a" stroke-width="1.6"/>
      <path d="M8 -30 Q15 -38 19 -36 Q15 -30 9 -27 Z" fill="#6f7d4a" stroke="#140d0a" stroke-width="1.2"/>
      <circle cx="6.5" cy="-27" r="2.2" fill="#ffd75a" opacity="0.6" filter="url(#brillo)"/>
      <circle cx="6.5" cy="-27" r="1.1" fill="#ffd75a"/>
      <path d="M1 -16 L9 -13" stroke="#140d0a" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M1 -16 L9 -13" stroke="#6f7d4a" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <!-- paladin on the battlements, frontal, hammer raised -->
    <g id="h">
      <path d="M-14 -56 Q-24 -30 -27 0 H27 Q24 -30 14 -56 Z"/>
      <path d="M-11 -36 H11 L13 -24 H-13 Z"/>
      <path d="M-11 -58 Q0 -62 11 -58 Q13 -46 10 -35 H-10 Q-13 -46 -11 -58 Z"/>
      <path d="M-9 -61 Q-21 -63 -21 -51 Q-15 -49 -9 -52 Z M9 -61 Q21 -63 21 -51 Q15 -49 9 -52 Z"/>
      <path d="M-7 -74 Q-7 -81 0 -81 Q7 -81 7 -74 L7 -61 Q0 -58 -7 -61 Z"/>
      <path d="M-1.5 -80 Q0 -90 4 -93 Q3 -86 1.5 -80 Z"/>
      <path d="M14 -56 L20 -58 L26 -76 L28 -92 L22 -92 L20 -78 L12 -62 Z"/>
      <path d="M-14 -56 L-20 -56 L-26 -40 L-22 -38 Z"/>
      <path d="M20 -86 L30 -114" fill="none" stroke-width="5" stroke-linecap="round"/>
      <path d="M16 -122 H40 L42 -112 H14 Z"/>
    </g>
  </defs>

  <!-- night siege: the fortress gate -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M22 12h.1M48 24h.1M110 10h.1M168 14h.1M236 20h.1M262 8h.1M200 30h.1M14 36h.1" stroke="#fff0c0" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M0 96 Q60 86 120 92 T280 90 V160 H0 Z" fill="#241b0c"/>
  <!-- curtain wall with merlons -->
  <path d="M0 120 V52 H8 V46 H18 V52 H30 V46 H40 V52 H52 V46 H58 V120 Z M222 120 V46 H228 V52 H240 V46 H250 V52 H262 V46 H272 V52 H280 V120 Z" fill="#33280f" stroke="#140d0a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- paladin on the battlement above the gate, behind the merlons -->
  <use href="#h" transform="translate(141 61) scale(0.34)" fill="#ffd35a" stroke="#ffd35a"/>
  <use href="#h" transform="translate(140 62) scale(0.34)" fill="#0b0910" stroke="#0b0910"/>
  <path d="M98 120 V56 H104 V50 H114 V56 H126 V50 H136 V56 H144 V50 H154 V56 H166 V50 H176 V56 H182 V120 Z" fill="#3a2d12" stroke="#140d0a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- towers -->
  <path d="M58 120 V34 H62 V26 H72 V34 H78 V26 H88 V34 H94 V26 H100 V120 Z" fill="#3e3014" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M86 34 H100 V120 H90 Z" fill="#2c220e"/>
  <path d="M180 120 V34 H186 V26 H192 V34 H198 V26 H208 V34 H214 V26 H222 V34 V120 Z" fill="#3e3014" stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M208 34 H222 V120 H212 Z" fill="#2c220e"/>
  <path d="M58 60 H100 M58 88 H100 M180 60 H222 M180 88 H222 M0 72 H58 M222 72 H280 M0 96 H58 M222 96 H280 M20 72 V96 M40 52 V72 M250 72 V96 M236 52 V72 M76 60 V88 M198 60 V88" stroke="#1f180a" stroke-width="1"/>
  <path d="M77 44 H81 V54 H77 Z M199 44 H203 V54 H199 Z" fill="#ffb050"/>
  <path d="M77 44 H81 V54 H77 Z M199 44 H203 V54 H199 Z" fill="#ffb050" opacity="0.6" filter="url(#brillo)"/>
  <path d="M68 70 H72 V78 H68 Z M208 70 H212 V78 H208 Z" fill="#140d0a"/>
  <!-- banners on the towers -->
  <path d="M79 26 V8 M201 26 V8" stroke="#140d0a" stroke-width="1.6"/>
  <path d="M80 9 L94 11 L90 15 L94 20 L80 19 Z M202 9 L216 11 L212 15 L216 20 L202 19 Z" fill="#e8dcc0" stroke="#140d0a" stroke-width="1"/>
  <path d="M84 12 L86 17 M206 12 L208 17" stroke="#c9901e" stroke-width="1.6"/>

  <rect width="280" height="160" fill="url(#halo)"/>

  <!-- the gate, sealed by a giant shield of light -->
  <path d="M110 120 V82 Q110 68 140 66 Q170 68 170 82 V120 Z" fill="#140d0a"/>
  <path d="M106 120 V82 Q106 64 140 62 Q174 64 174 82 V120" fill="none" stroke="#5a4a28" stroke-width="3"/>
  <path d="M104 120 L78 160 H202 L176 120 Z" fill="url(#abanico)"/>
  <path d="M113 68 Q140 59 167 68 Q170 100 140 127 Q110 100 113 68 Z" fill="#ffd35a" opacity="0.75" filter="url(#fuerte)"/>
  <path d="M113 68 Q140 59 167 68 Q170 100 140 127 Q110 100 113 68 Z" fill="url(#luz)" stroke="#140d0a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M118 72 Q140 64 162 72 Q165 98 140 121 Q115 98 118 72 Z" fill="none" stroke="#c9901e" stroke-width="1.6"/>
  <path d="M142 70 Q161 66 162 72 Q165 98 140 121 Q156 96 142 70 Z" fill="#f0bc4a" opacity="0.55"/>
  <circle cx="140" cy="88" r="7.5" fill="#fffaf0" stroke="#c9901e" stroke-width="1.4"/>
  <path d="M140 75 V79 M140 97 V101 M127 88 H131 M149 88 H153 M131 79 L134 82 M149 79 L146 82 M131 97 L134 94 M149 97 L146 94" stroke="#c9901e" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M121 75 Q129 69 138 67" fill="none" stroke="#fffaf0" stroke-width="1.8" stroke-linecap="round"/>


  <!-- the ram bounces off the shield -->
  <path d="M0 124 Q70 118 140 124 T280 122 V160 H0 Z" fill="#17110a"/>
  <path d="M66 131 L118 108" stroke="#140d0a" stroke-width="9" stroke-linecap="round"/>
  <path d="M66 131 L118 108" stroke="#6a4a26" stroke-width="6" stroke-linecap="round"/>
  <path d="M70 128 L114 108.5" stroke="#8a6436" stroke-width="1.4"/>
  <path d="M112 104 L122 101 L125 110 L116 114 Z" fill="#6c747b" stroke="#140d0a" stroke-width="1.5" stroke-linejoin="round"/>
  <use href="#g" transform="translate(84 136) rotate(-12)"/>
  <use href="#g" transform="translate(100 130) rotate(-18) scale(0.92)"/>
  <circle cx="124" cy="104" r="7" fill="#fff4d6" opacity="0.85" filter="url(#brillo)"/>
  <path d="M124 104 L130 96 M124 104 L133 104 M124 104 L130 111 M124 104 L120 95" stroke="#fffaf0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the horde's torches in the dark -->
  <g fill="#ff9a3a">
    <circle cx="22" cy="118" r="1.6"/><circle cx="40" cy="120" r="1.4"/><circle cx="236" cy="118" r="1.6"/><circle cx="254" cy="121" r="1.4"/><circle cx="268" cy="117" r="1.3"/>
  </g>
  <g fill="#ff9a3a" opacity="0.6" filter="url(#brillo)">
    <circle cx="22" cy="118" r="4"/><circle cx="40" cy="120" r="3.4"/><circle cx="236" cy="118" r="4"/><circle cx="254" cy="121" r="3.4"/><circle cx="268" cy="117" r="3.2"/>
  </g>
  <path d="M214 132 L222 110 L224 111 L217 133 Z M232 134 L226 116 L228 115 L234 133 Z" fill="#1c150a"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
