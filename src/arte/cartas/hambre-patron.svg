<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#381c50"/>
      <stop offset="1" stop-color="#11071c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#c98bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c98bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="garganta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c8ff"/>
      <stop offset="0.35" stop-color="#9a52e0"/>
      <stop offset="1" stop-color="#1a0828"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.58" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- ruined altar under a torn sky -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <path d="M0 118 L14 70 L26 70 L30 118 Z M252 118 L256 62 L270 62 L274 118 Z" fill="#1a0c28" stroke="#140d0a" stroke-width="1.5"/>
  <path d="M10 70 L30 70 L28 64 L12 64 Z M250 62 L274 62 L272 56 L252 56 Z" fill="#221234"/>

  <!-- the patron's maw opening in the clouds -->
  <circle cx="140" cy="46" r="40" fill="#c98bff" opacity="0.35" filter="url(#fuerte)"/>
  <path d="M92 46 Q140 -4 188 46 Q140 92 92 46 Z" fill="url(#garganta)" stroke="#140d0a" stroke-width="3"/>
  <!-- fangs -->
  <path d="M100 40 L106 52 L112 36 L118 50 L126 32 L132 48 L140 30 L148 48 L154 32 L162 50 L168 36 L174 52 L180 40 Q140 20 100 40 Z" fill="#e0d4c0" stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M102 54 L110 46 L116 60 L124 50 L132 64 L140 54 L148 64 L156 50 L164 60 L170 46 L178 54 Q140 76 102 54 Z" fill="#cfc2ac" stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- tentacles curling out of the maw -->
  <g fill="none" stroke-linecap="round">
    <path d="M94 46 Q70 40 62 58 Q58 72 70 74 M186 46 Q212 38 220 56 Q224 70 212 72 M110 70 Q100 90 86 92" stroke="#140d0a" stroke-width="6"/>
    <path d="M94 46 Q70 40 62 58 Q58 72 70 74 M186 46 Q212 38 220 56 Q224 70 212 72 M110 70 Q100 90 86 92" stroke="#5a2a80" stroke-width="3"/>
    <path d="M94 44 Q72 38 64 56 M186 44 Q210 36 218 54" stroke="#a060e0" stroke-width="1"/>
  </g>

  <!-- curses torn from the hero, swirling up into the mouth -->
  <g stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round">
    <g transform="translate(120 78) rotate(-18)">
      <rect x="-9" y="-12" width="18" height="24" rx="2" fill="#3a2a30"/>
      <path d="M-5 -6 L5 4 M5 -6 L-5 4" stroke="#8ae05a" stroke-width="1.4"/>
    </g>
    <g transform="translate(160 84) rotate(22)">
      <rect x="-9" y="-12" width="18" height="24" rx="2" fill="#40202a"/>
      <circle cx="0" cy="-1" r="4" fill="none" stroke="#ff6a3a" stroke-width="1.4"/>
    </g>
    <g transform="translate(142 70) rotate(6) scale(0.8)">
      <rect x="-9" y="-12" width="18" height="24" rx="2" fill="#2c2438"/>
      <path d="M-4 -4 Q0 -9 4 -4 Q4 2 0 2 M0 5 L0 6" fill="none" stroke="#c98bff" stroke-width="1.4"/>
    </g>
  </g>
  <path d="M120 90 Q118 100 128 106 M160 96 Q164 104 154 110 M142 80 Q146 92 140 100" fill="none" stroke="#c98bff" stroke-width="3" opacity="0.6" filter="url(#brillo)"/>

  <!-- the warlock below, arms raised in offering -->
  <path d="M0 124 Q140 116 280 124 L280 160 L0 160 Z" fill="#12081c"/>
  <g transform="translate(1.3 -1.3)" fill="#c98bff" opacity="0.85">
    <path d="M122 160 Q120 132 130 122 L150 122 Q160 132 158 160 Z"/>
    <path d="M132 124 Q128 110 140 106 Q152 110 148 124 Z"/>
    <path d="M130 126 L112 104 L116 101 L134 120 Z M150 126 L168 104 L164 101 L146 120 Z"/>
  </g>
  <g fill="#0b0910">
    <path d="M122 160 Q120 132 130 122 L150 122 Q160 132 158 160 Z"/>
    <path d="M132 124 Q128 110 140 106 Q152 110 148 124 Z"/>
    <path d="M133 110 Q126 102 128 94 Q132 102 136 107 Z M147 110 Q154 102 152 94 Q148 102 144 107 Z"/>
    <path d="M130 126 L112 104 L116 101 L134 120 Z M150 126 L168 104 L164 101 L146 120 Z"/>
    <path d="M126 128 Q128 116 140 118 Q152 116 154 128 Z"/>
  </g>
  <circle cx="114" cy="100" r="4" fill="#c98bff" opacity="0.7" filter="url(#brillo)"/>
  <circle cx="166" cy="100" r="4" fill="#c98bff" opacity="0.7" filter="url(#brillo)"/>
  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
