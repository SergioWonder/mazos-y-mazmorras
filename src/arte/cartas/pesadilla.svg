<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1630"/>
      <stop offset="1" stop-color="#0a0710"/>
    </linearGradient>
    <radialGradient id="luna" cx="0.8" cy="0.2" r="0.32">
      <stop offset="0" stop-color="#d8d0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d8d0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brasas" cx="0.14" cy="0.82" r="0.3">
      <stop offset="0" stop-color="#ff7a3a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff7a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- campamento bajo la luna -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <rect width="280" height="160" fill="url(#luna)"/>
  <circle cx="224" cy="32" r="15" fill="#e6e0ff" opacity="0.5" filter="url(#brillo)"/>
  <circle cx="224" cy="32" r="12" fill="#e6e0f4"/>
  <circle cx="219" cy="29" r="2.6" fill="#c8c0dc"/>
  <circle cx="228" cy="37" r="1.8" fill="#c8c0dc"/>
  <path d="M0 98 L12 80 L20 96 L30 72 L40 96 L52 78 L62 98 L240 98 L250 76 L258 96 L268 70 L280 92 L280 112 L0 112 Z" fill="#110c1a"/>
  <rect width="280" height="160" fill="url(#brasas)"/>
  <path d="M0 110 Q140 102 280 112 L280 160 L0 160 Z" fill="#150f1c"/>
  <!-- hoguera casi apagada -->
  <path d="M26 132 L52 124 M28 124 L50 132" stroke="#140d0a" stroke-width="5" stroke-linecap="round"/>
  <path d="M26 132 L52 124 M28 124 L50 132" stroke="#3a2a1c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="39" cy="127" rx="8" ry="4" fill="#ff6a2a" opacity="0.7" filter="url(#brillo)"/>
  <path d="M35 128 Q38 120 40 126 Q42 122 43 128 Z" fill="#ffb060"/>

  <!-- el héroe dormido sobre el petate, a contraluz -->
  <path d="M70 136 L250 132 L252 142 L68 146 Z" fill="#2a2030" stroke="#0a0508" stroke-width="1.4"/>
  <g transform="translate(1.3 -1.3)" fill="#9a88d8" opacity="0.8">
    <path d="M86 134 Q84 122 96 120 Q118 114 150 116 Q190 114 226 120 Q236 124 230 132 Z"/>
    <circle cx="80" cy="126" r="8"/>
  </g>
  <g fill="#0b0910">
    <path d="M86 134 Q84 122 96 120 Q118 114 150 116 Q190 114 226 120 Q236 124 230 132 Z"/>
    <circle cx="80" cy="126" r="8"/>
    <path d="M72 124 Q70 116 80 116 Q76 120 74 126 Z"/>
  </g>
  <path d="M96 124 Q150 118 222 124" fill="none" stroke="#1e1628" stroke-width="1"/>

  <!-- la saga nocturna agazapada sobre su pecho -->
  <!-- pelo lacio que cae -->
  <path d="M142 46 Q128 60 126 84 M148 44 Q136 66 138 92 M160 44 Q170 64 168 90" fill="none" stroke="#140d0a" stroke-width="5" stroke-linecap="round"/>
  <path d="M142 46 Q128 60 126 84 M148 44 Q136 66 138 92 M160 44 Q170 64 168 90" fill="none" stroke="#3e3a44" stroke-width="3" stroke-linecap="round"/>
  <!-- piernas flexionadas -->
  <path d="M136 116 Q124 100 132 88 Q140 96 146 116 Z M172 116 Q186 102 178 88 Q170 96 164 116 Z" fill="#5a6456" stroke="#140d0a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M138 110 Q132 100 134 92 M174 108 Q180 100 178 94" stroke="#3e463c" stroke-width="1" fill="none"/>
  <!-- pies de garra sobre el pecho -->
  <path d="M132 116 L128 120 M136 117 L134 121 M176 116 L180 120 M172 117 L174 121" stroke="#140d0a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- torso encorvado -->
  <path d="M136 92 Q134 70 148 60 Q166 58 174 72 Q180 88 170 100 Q154 108 140 100 Z" fill="#5a6456" stroke="#140d0a" stroke-width="2.2"/>
  <path d="M162 62 Q176 74 172 94 Q166 102 156 104 Q168 88 162 62 Z" fill="#3e463c"/>
  <path d="M146 74 Q152 76 158 74 M144 82 Q152 84 160 82 M146 90 Q152 92 158 90" stroke="#3a4238" stroke-width="0.9" fill="none"/>
  <!-- brazos larguísimos hacia la cara del héroe -->
  <path d="M142 70 Q118 76 98 100 Q90 110 86 118" fill="none" stroke="#140d0a" stroke-width="7" stroke-linecap="round"/>
  <path d="M142 70 Q118 76 98 100 Q90 110 86 118" fill="none" stroke="#5a6456" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M86 118 L80 116 M86 118 L82 121 M87 119 L86 124" stroke="#140d0a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M170 72 Q196 70 204 88 Q206 98 200 104" fill="none" stroke="#140d0a" stroke-width="7" stroke-linecap="round"/>
  <path d="M170 72 Q196 70 204 88 Q206 98 200 104" fill="none" stroke="#5a6456" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M200 104 L196 109 M200 104 L201 110 M201 104 L205 108" stroke="#140d0a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cabeza ganchuda -->
  <path d="M140 48 Q142 32 154 30 Q168 30 170 44 Q170 56 160 60 Q146 62 140 48 Z" fill="#5a6456" stroke="#140d0a" stroke-width="2.2"/>
  <path d="M160 32 Q172 38 168 52 Q164 60 156 60 Q166 48 160 32 Z" fill="#3e463c"/>
  <path d="M146 50 Q140 60 136 58 Q140 54 142 48 Z" fill="#5a6456" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M142 32 Q146 24 156 26 Q166 24 172 32 Q164 28 156 30 Q148 28 142 32 Z" fill="#2a2830" stroke="#140d0a" stroke-width="1.2"/>
  <!-- ojos que brillan -->
  <circle cx="150" cy="43" r="4" fill="#ffcf4a" opacity="0.7" filter="url(#brillo)"/>
  <circle cx="162" cy="42" r="4" fill="#ffcf4a" opacity="0.7" filter="url(#brillo)"/>
  <circle cx="150" cy="43" r="1.8" fill="#ffe27a"/>
  <circle cx="162" cy="42" r="1.8" fill="#ffe27a"/>
  <path d="M148 53 Q155 57 162 52" fill="none" stroke="#140d0a" stroke-width="1.4"/>
  <path d="M151 54 L152 56.6 M156 55 L157 57.6" stroke="#d8d0b0" stroke-width="1"/>

  <!-- el mal sueño sale en volutas violetas -->
  <path d="M84 110 Q70 96 78 84 Q88 74 80 62 M94 108 Q104 94 96 82" fill="none" stroke="#9a6ad8" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#brillo)"/>
  <path d="M84 110 Q70 96 78 84 Q88 74 80 62 M94 108 Q104 94 96 82" fill="none" stroke="#c9a8ff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
