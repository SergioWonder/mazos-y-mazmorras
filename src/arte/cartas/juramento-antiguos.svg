  <path d="M84 0 L100 130 M186 0 L198 130" stroke="#262610" stroke-width="3"/>
  <path d="M112 0 L150 0 L200 128 L120 128 Z" fill="url(#haz)"/>
  <path d="M60 0 L80 0 L96 128 L70 128 Z" fill="url(#haz)" opacity="0.7"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <!-- giant trunks framing the glade -->
  <path d="M0 0 L58 0 Q46 40 52 80 Q56 110 76 132 L0 132 Z" fill="#1a1a0a"/>
  <path d="M28 132 Q40 118 52 120 Q58 126 76 132 Z M8 132 Q12 120 22 116 L26 132 Z" fill="#141408"/>
  <path d="M14 10 Q24 40 18 80 M36 0 Q30 30 38 70 Q44 100 56 124" fill="none" stroke="#2c2c12" stroke-width="2"/>
  <path d="M280 0 L226 0 Q236 34 230 76 Q226 108 206 132 L280 132 Z" fill="#1a1a0a"/>
  <path d="M206 132 Q224 118 236 122 L240 132 Z M252 132 Q260 118 272 118 L270 132 Z" fill="#141408"/>
  <path d="M264 6 Q254 40 260 84 M244 0 Q250 34 244 72 Q238 102 226 124" fill="none" stroke="#2c2c12" stroke-width="2"/>
  <!-- golden vines climbing the trunks -->
  <path d="M40 132 Q30 110 44 94 Q56 78 42 60 Q30 44 44 24 Q52 12 46 0 M240 132 Q252 110 238 92 Q226 76 240 58 Q252 40 238 20" fill="none" stroke="#ffd35a" stroke-width="4" opacity="0.5" filter="url(#brillo)"/>
  <path d="M40 132 Q30 110 44 94 Q56 78 42 60 Q30 44 44 24 Q52 12 46 0 M240 132 Q252 110 238 92 Q226 76 240 58 Q252 40 238 20" fill="none" stroke="#e8c050" stroke-width="1.3"/>
  <g fill="#e8d070">
    <use href="#hoja" transform="translate(44 94) rotate(-40)"/><use href="#hoja" transform="translate(42 60) rotate(200)"/><use href="#hoja" transform="translate(44 24) rotate(-30)"/><use href="#hoja" transform="translate(34 114) rotate(210)"/>
    <use href="#hoja" transform="translate(238 92) rotate(220)"/><use href="#hoja" transform="translate(240 58) rotate(-20)"/><use href="#hoja" transform="translate(246 112) rotate(-50)"/><use href="#hoja" transform="translate(238 20) rotate(200)"/>
  </g>
  <!-- mossy ground -->
  <path d="M0 126 Q70 118 140 124 T280 124 L280 160 L0 160 Z" fill="#16180a"/>
  <path d="M60 126 Q66 120 72 126 M190 124 Q196 118 202 124 M110 128 Q114 124 118 128" fill="none" stroke="#3a4418" stroke-width="1.4"/>

  <g transform="translate(150 128) scale(1.16) translate(-150 -128)">
  <!-- green-gold aura around the kneeling hero -->
  <ellipse cx="140" cy="96" rx="58" ry="40" fill="#c8e070" opacity="0.3" filter="url(#brillo)"/>
  <ellipse cx="140" cy="128" rx="60" ry="6" fill="#ffd35a" opacity="0.4" filter="url(#brillo)"/>
  <use href="#h" transform="translate(1.5 -1.5)" fill="#e0d870"/>
  <use href="#h" fill="#0b0910"/>
  <path d="M130 60 H140" stroke="#d8e070" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M122 72 Q116 94 118 100 M142 79 L168 88" fill="none" stroke="#e0d870" stroke-width="0.9" opacity="0.5"/>

  <!-- old bronze shield planted in the moss -->
  <path d="M164 82 L200 82 Q202 110 182 130 Q162 110 164 82 Z" fill="#140d0a"/>
  <path d="M167 85 L197 85 Q199 108 182 126 Q165 108 167 85 Z" fill="url(#bronce)"/>
  <path d="M182 85 L197 85 Q199 108 182 126 Z" fill="#3a3e20" opacity="0.6"/>
  <path d="M172 90 L192 90 Q193 106 182 119 Q171 106 172 90 Z" fill="none" stroke="#140d0a" stroke-width="1"/>
  <path d="M182 92 Q176 100 182 110 Q188 100 182 92 Z" fill="#d8c060" stroke="#140d0a" stroke-width="1"/>
  <path d="M182 110 V116" stroke="#140d0a" stroke-width="1.2"/>
  <path d="M169 87 Q176 84 181 85" fill="none" stroke="#e0d8a0" stroke-width="1.3" opacity="0.8"/>

  <!-- golden vines spiralling up the shield and his arm -->
  <path d="M160 130 Q156 116 168 110 Q186 104 194 94 Q198 86 186 82 Q172 80 166 88 M206 130 Q208 116 196 112 M150 128 Q140 112 152 100 Q160 92 170 90" fill="none" stroke="#ffd35a" stroke-width="4.5" opacity="0.7" filter="url(#brillo)"/>
  <path d="M160 130 Q156 116 168 110 Q186 104 194 94 Q198 86 186 82 Q172 80 166 88 M206 130 Q208 116 196 112 M150 128 Q140 112 152 100 Q160 92 170 90" fill="none" stroke="#fff0a0" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="#f4e070" stroke="#7a6a20" stroke-width="0.5">
    <use href="#hoja" transform="translate(168 110) rotate(-160)"/>
    <use href="#hoja" transform="translate(186 104) rotate(-40)"/>
    <use href="#hoja" transform="translate(196 88) rotate(-90)"/>
    <use href="#hoja" transform="translate(176 81) rotate(-120)"/>
    <use href="#hoja" transform="translate(152 100) rotate(-150)"/>
    <use href="#hoja" transform="translate(162 92) rotate(-60)"/>
    <use href="#hoja" transform="translate(200 116) rotate(-30)"/>
    <use href="#hoja" transform="translate(146 116) rotate(200)"/>
  </g>
  <circle cx="166" cy="88" r="2.2" fill="#fffaf0"/>
  <circle cx="196" cy="112" r="2" fill="#fffaf0"/>

  </g>

  <!-- fireflies -->
  <path d="M96 70h.1M112 44h.1M178 56h.1M204 70h.1M88 104h.1M214 98h.1M150 40h.1M124 112h.1" stroke="#e8f080" stroke-width="3.4" stroke-linecap="round" opacity="0.6" filter="url(#suave)"/>
  <path d="M96 70h.1M112 44h.1M178 56h.1M204 70h.1M88 104h.1M214 98h.1M150 40h.1M124 112h.1" stroke="#fffad0" stroke-width="1.3" stroke-linecap="round"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
