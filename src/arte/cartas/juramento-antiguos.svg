<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="0.5" stop-color="#3a3a16"/>
      <stop offset="1" stop-color="#141509"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.52" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#d8e070" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffd35a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.52" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.66"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e890" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f0e890" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bronce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8a50"/>
      <stop offset="1" stop-color="#3e4424"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <path id="hoja" d="M0 0 Q3 -3 7 0 Q3 3 0 0 Z"/>
    <!-- paladin kneeling, facing right, leafy crown on the helm, hand on the planted shield -->
    <g id="h">
      <path d="M122 72 Q104 96 96 127 L124 127 Q118 104 126 80 Z"/>
      <path d="M124 64 Q123 52 132 51 Q141 52 141 62 L140 70 L126 70 Z"/>
      <path d="M125 56 L119 45 L127 52 L129 41 L133 51 L139 42 L139 55 Z"/>
      <path d="M120 74 Q116 90 120 104 L146 104 Q148 88 142 74 Z"/>
      <path d="M121 79 Q119 68 132 68 Q143 69 143 78 Q132 83 121 79 Z"/>
      <path d="M136 97 L160 97 Q167 99 167 107 L167 124 L157 124 L157 110 L136 111 Z"/>
      <path d="M154 127 L174 127 L172 120 L156 120 Z"/>
      <path d="M121 99 L141 104 L136 127 L104 128 L104 122 L126 118 Z"/>
      <path d="M137 77 L152 79 L171 86 L169 95 L148 92 Z"/>
    </g>
  </defs>

