<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#381c50"/>
      <stop offset="1" stop-color="#11071c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.3" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#c98bff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c98bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.58" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- void sky with floating ruins -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M150 34 L170 30 L176 40 L160 46 Z M212 20 L236 16 L242 28 L220 34 Z M96 18 L110 16 L112 24 L100 26 Z" fill="#1e0f2e" stroke="#140d0a" stroke-width="1.2"/>
  <path d="M160 46 L164 56 M226 34 L228 44 M104 26 L104 32" stroke="#1e0f2e" stroke-width="2"/>
  <path d="M182 120 L186 70 L196 62 L204 70 L206 120 Z M232 120 L234 52 L246 40 L258 52 L260 120 Z" fill="#1a0c28"/>
  <path d="M244 70 L248 70 L248 80 L244 80 Z" fill="#c98bff" opacity="0.4"/>
  <rect width="280" height="160" fill="url(#halo)"/>

  <!-- cliff edge where the warlock stands -->
  <path d="M0 120 L0 104 Q30 96 62 102 Q76 106 82 118 L90 160 L0 160 Z" fill="#150a22" stroke="#140d0a" stroke-width="2"/>
  <path d="M82 118 L150 124 Q220 118 280 126 L280 160 L90 160 Z" fill="#0f0718"/>
  <path d="M20 112 Q40 108 60 112 M10 132 L40 128" stroke="#241238" stroke-width="1.2" fill="none"/>

  <!-- warlock silhouette with violet rim light, arm thrown forward -->
  <g transform="translate(1.3 -1.3)" fill="#c98bff" opacity="0.85">
    <path d="M34 104 Q30 84 36 70 Q40 60 48 58 Q56 60 58 72 Q60 86 56 104 Z"/>
    <path d="M40 58 Q36 50 38 44 Q44 40 50 44 Q52 50 50 58 Z"/>
    <path d="M52 68 L78 64 L80 69 L56 76 Z"/>
  </g>
  <g fill="#0b0910">
    <path d="M34 104 Q30 84 36 70 Q40 60 48 58 Q56 60 58 72 Q60 86 56 104 Z"/>
    <path d="M28 104 L34 76 Q24 90 22 104 Z M58 104 L60 82 Q66 92 64 104 Z"/>
    <path d="M40 58 Q36 50 38 44 Q44 40 50 44 Q52 50 50 58 Z"/>
    <path d="M40 46 Q34 38 36 30 Q40 38 43 43 Z M48 44 Q54 36 54 28 Q49 36 46 42 Z"/>
    <path d="M36 62 Q38 52 44 56 L52 56 Q58 52 58 64 Z"/>
    <path d="M52 68 L78 64 L80 69 L56 76 Z"/>
  </g>
  <circle cx="43.5" cy="49" r="1.2" fill="#f0dcff"/>
  <circle cx="47.5" cy="49" r="1.2" fill="#f0dcff"/>

  <!-- the eldritch spear: a long beam that thickens as it goes -->
  <path d="M82 66 L150 60 L214 54 L214 70 L150 72 Z" fill="#c98bff" opacity="0.55" filter="url(#fuerte)"/>
  <path d="M82 66 Q150 58 214 56 L214 68 Q150 70 82 67 Z" fill="#c98bff" opacity="0.8" filter="url(#brillo)"/>
  <path d="M82 66.5 Q150 61 212 59 L212 65 Q150 67 82 66.8 Z" fill="#f0dcff"/>
  <!-- growth rings along the shaft (every cast makes it longer and stronger) -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#c98bff" stroke-width="4" opacity="0.6" filter="url(#suave)">
      <ellipse cx="112" cy="64" rx="3" ry="7"/>
      <ellipse cx="146" cy="63" rx="3.6" ry="9"/>
      <ellipse cx="182" cy="62" rx="4.2" ry="11"/>
    </g>
    <g stroke="#f0dcff" stroke-width="1.2">
      <ellipse cx="112" cy="64" rx="3" ry="7"/>
      <ellipse cx="146" cy="63" rx="3.6" ry="9"/>
      <ellipse cx="182" cy="62" rx="4.2" ry="11"/>
    </g>
  </g>
  <!-- spearhead -->
  <path d="M208 50 L238 62 L208 74 L214 62 Z" fill="#c98bff" opacity="0.8" filter="url(#brillo)"/>
  <path d="M210 53 L234 62 L210 71 L215 62 Z" fill="#f0dcff" stroke="#ffffff" stroke-width="0.8"/>

  <!-- skeleton impaled at the tip -->
  <g stroke="#140d0a" stroke-width="2" stroke-linejoin="round">
    <path d="M238 118 L236 96 L244 96 L246 118 Z" fill="#b8b0a0"/>
    <path d="M232 96 Q240 88 250 96 L248 104 L234 104 Z" fill="#d8d0c0"/>
    <path d="M236 88 Q236 76 244 76 Q252 76 252 88 Q248 92 244 92 Q240 92 236 88 Z" fill="#e0d8c8"/>
    <path d="M232 98 L220 86 M250 98 L262 90" fill="none" stroke-width="3"/>
  </g>
  <path d="M236 100 L248 100 M236 103 L248 103" stroke="#6a6258" stroke-width="0.9"/>
  <path d="M232 98 L220 86 M250 98 L262 90" stroke="#d8d0c0" stroke-width="1.4" fill="none"/>
  <circle cx="241" cy="84" r="2" fill="#6ab0ff" filter="url(#suave)"/>
  <circle cx="248" cy="84" r="2" fill="#6ab0ff" filter="url(#suave)"/>
  <circle cx="241" cy="84" r="0.8" fill="#dff0ff"/>
  <circle cx="248" cy="84" r="0.8" fill="#dff0ff"/>
  <!-- impact burst -->
  <circle cx="238" cy="62" r="12" fill="#c98bff" opacity="0.5" filter="url(#fuerte)"/>
  <path d="M238 62 L256 52 M238 62 L260 64 M238 62 L252 76 M238 62 L244 44" stroke="#f0dcff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- motes of the void -->
  <g fill="#c98bff" opacity="0.7">
    <circle cx="120" cy="48" r="1.1"/><circle cx="166" cy="80" r="1.2"/><circle cx="196" cy="44" r="0.9"/><circle cx="98" cy="82" r="1"/>
  </g>
  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
