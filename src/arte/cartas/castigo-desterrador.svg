    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.62" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
