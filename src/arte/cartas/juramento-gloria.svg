    <use href="#hoja" transform="translate(167.7 80.1) rotate(-104)"/><use href="#hoja" transform="translate(173.7 74.8) rotate(-174)"/>
    <use href="#hoja" transform="translate(162.4 71.8) rotate(-85)"/><use href="#hoja" transform="translate(169.8 68.6) rotate(-155)"/>
