    <use href="#hoja" transform="translate(161 52.3) rotate(-47)"/><use href="#hoja" transform="translate(168.7 54.4) rotate(-117)"/>
    <use href="#hoja" transform="translate(165.1 43.3) rotate(-28)"/><use href="#hoja" transform="translate(171.7 47.7) rotate(-98)"/>
