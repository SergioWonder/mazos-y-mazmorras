<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a3a"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.36" cy="0.66" r="0.4">
      <stop offset="0" stop-color="#8ad0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8ad0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f4ff"/>
      <stop offset="1" stop-color="#6aa8d8"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ciénaga helada de noche -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M0 100 Q20 90 40 96 Q70 86 100 94 Q140 84 180 94 Q220 86 250 92 Q266 88 280 92 L280 112 L0 112 Z" fill="#111a24"/>
  <!-- árboles muertos -->
  <path d="M250 100 L246 40 M246 60 Q236 50 228 48 M247 52 Q256 42 264 40 M22 100 L26 56 M25 70 Q16 62 10 62" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <path d="M0 110 Q140 104 280 112 L280 160 L0 160 Z" fill="#101820"/>
  <path d="M20 128 Q80 122 140 126 M150 140 Q200 134 260 138" stroke="#2a3e52" stroke-width="1.2" fill="none"/>

  <!-- necrófago que paraliza con su zarpa -->
  <g>
    <path d="M214 132 Q206 118 214 108 M234 132 Q240 118 230 108" fill="none" stroke="#140d0a" stroke-width="8" stroke-linecap="round"/>
    <path d="M214 132 Q206 118 214 108 M234 132 Q240 118 230 108" fill="none" stroke="#7a8a7e" stroke-width="5" stroke-linecap="round"/>
    <path d="M206 110 Q200 88 214 74 Q232 68 242 84 Q248 102 236 112 Q220 118 206 110 Z" fill="#7a8a7e" stroke="#140d0a" stroke-width="2.2"/>
    <path d="M232 72 Q246 84 242 102 Q238 112 228 114 Q240 96 232 72 Z" fill="#5a6a5e"/>
    <path d="M214 86 Q222 88 230 86 M212 94 Q222 96 232 94 M214 102 Q222 104 230 102" stroke="#4e5c52" stroke-width="0.9" fill="none"/>
    <!-- cabeza -->
    <path d="M204 72 Q198 56 210 50 Q224 46 228 58 Q230 70 218 74 Q208 76 204 72 Z" fill="#7a8a7e" stroke="#140d0a" stroke-width="2.2"/>
    <path d="M220 50 Q230 56 226 68 Q222 74 216 74 Q224 64 220 50 Z" fill="#5a6a5e"/>
    <path d="M200 62 Q194 60 196 54 Q200 58 204 58" fill="#7a8a7e" stroke="#140d0a" stroke-width="1.4"/>
    <circle cx="208" cy="60" r="3.6" fill="#8ad0ff" opacity="0.8" filter="url(#brillo)"/>
    <circle cx="208" cy="60" r="1.6" fill="#e0f4ff"/>
    <path d="M204 67 Q210 72 218 68 Z" fill="#1a120e" stroke="#140d0a" stroke-width="1.2"/>
    <path d="M206 68 L207 71 M210 69 L211 72 M214 69 L214.6 71.6" stroke="#d8d0b0" stroke-width="1"/>
    <!-- brazo extendido, garras hacia el héroe -->
    <path d="M208 84 Q188 80 170 84" fill="none" stroke="#140d0a" stroke-width="8" stroke-linecap="round"/>
    <path d="M208 84 Q188 80 170 84" fill="none" stroke="#7a8a7e" stroke-width="5" stroke-linecap="round"/>
    <path d="M170 84 L160 78 M170 84 L158 84 M170 85 L160 91" stroke="#140d0a" stroke-width="3" stroke-linecap="round"/>
    <path d="M170 84 L160 78 M170 84 L158 84 M170 85 L160 91" stroke="#c8c0a8" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- el hechizo paralizante vuela en hebras -->
  <path d="M156 84 Q136 76 118 86 M156 86 Q134 96 112 94" fill="none" stroke="#8ad0ff" stroke-width="5" stroke-linecap="round" opacity="0.6" filter="url(#brillo)"/>
  <path d="M156 84 Q136 76 118 86 M156 86 Q134 96 112 94" fill="none" stroke="#e0f4ff" stroke-width="1" stroke-linecap="round"/>

  <!-- héroe congelado a media zancada, a contraluz -->
  <g transform="translate(1.3 -1.3)" fill="#8ad0ff" opacity="0.85">
    <circle cx="96" cy="58" r="8"/>
    <path d="M84 68 Q96 64 106 70 L108 100 L84 100 Z"/>
    <path d="M86 98 L70 128 L78 130 L94 104 Z M100 98 L110 130 L118 128 L106 98 Z"/>
    <path d="M104 72 L128 60 L130 66 L108 80 Z M86 72 L66 88 L70 92 L90 80 Z"/>
  </g>
  <g fill="#0b0910">
    <circle cx="96" cy="58" r="8"/>
    <path d="M88 52 Q96 46 104 52 L103 56 Q96 52 89 56 Z"/>
    <path d="M84 68 Q96 64 106 70 L108 100 L84 100 Z"/>
    <path d="M86 98 L70 128 L78 130 L94 104 Z M100 98 L110 130 L118 128 L106 98 Z"/>
    <path d="M104 72 L128 60 L130 66 L108 80 Z M86 72 L66 88 L70 92 L90 80 Z"/>
    <path d="M128 58 L134 56 L136 62 L130 66 Z"/>
  </g>
  <!-- escarcha que lo atrapa: cristales desde el suelo -->
  <g stroke="#140d0a" stroke-width="1.6" stroke-linejoin="round">
    <path d="M62 132 L70 104 L78 132 Z" fill="url(#hielo)"/>
    <path d="M76 132 L86 112 L92 132 Z" fill="url(#hielo)"/>
    <path d="M100 132 L106 100 L114 132 Z" fill="url(#hielo)"/>
    <path d="M112 132 L124 114 L126 132 Z" fill="url(#hielo)"/>
    <path d="M54 132 L58 118 L64 132 Z" fill="url(#hielo)"/>
  </g>
  <path d="M70 108 L72 128 M106 104 L108 128 M86 116 L87 130" stroke="#ffffff" stroke-width="0.9" opacity="0.8"/>
  <path d="M60 126 Q90 120 130 126" fill="none" stroke="#8ad0ff" stroke-width="6" opacity="0.4" filter="url(#brillo)"/>
  <!-- escarcha en el cuerpo -->
  <path d="M86 90 l4 -4 M98 84 l3 3 M90 74 l-3 -3 M104 92 l3 -2" stroke="#e0f4ff" stroke-width="1.2" stroke-linecap="round"/>
  <g fill="#e0f4ff">
    <circle cx="80" cy="44" r="1"/><circle cx="116" cy="46" r="1"/><circle cx="60" cy="70" r="0.9"/><circle cx="130" cy="96" r="0.9"/>
  </g>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
