<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4a1c"/>
      <stop offset="1" stop-color="#1b1409"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.6" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe89a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="fuerte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- paladin pointing his hammer at the strike, facing right -->
    <g id="h">
      <path d="M-10 -57 Q-24 -40 -32 -9 Q-22 -5 -14 -11 Q-14 -34 -6 -50 Z"/>
      <path d="M-9 -25 L-2 -25 L-10 -12 L-15 -2 L-12 0 L-24 0 L-21 -4 L-17 -13 Z"/>
      <path d="M1 -25 L9 -25 L15 -13 L17 -3 L23 -1 L23 1 L11 1 L10 -11 L4 -17 Z"/>
      <path d="M-9 -35 L9 -35 L12 -24 L-11 -24 Z"/>
      <path d="M-9 -58 Q0 -61 10 -57 Q13 -46 8 -34 L-8 -34 Q-12 -46 -9 -58 Z"/>
      <path d="M-13 -55 Q-13 -63 -3 -61 L-4 -51 Q-10 -50 -13 -55 Z"/>
      <path d="M2 -60 Q13 -64 16 -54 Q12 -49 3 -51 Z"/>
      <path d="M-6 -75 L7 -75 Q9.5 -75 9.5 -72 L9.5 -61 Q2 -57.5 -6 -60.5 Z"/>
      <path d="M-5 -74 Q-15 -80 -24 -68 Q-15 -70 -6 -66 Z"/>
      <path d="M4 -59 L12 -60 L26 -58 L36 -58 L36 -53 L25 -52 L8 -52 Z"/>
      <circle cx="37" cy="-55.5" r="3.6"/>
      <path d="M-12 -54 L-5 -53 L-10 -38 L-16 -32 L-19 -36 L-15 -42 Z"/>
    </g>
    <!-- orc thrown by the blast -->
    <g id="o">
      <path d="M-6 10 L-8 22 M6 10 L10 21" fill="none" stroke="#140d0a" stroke-width="9" stroke-linecap="round"/>
      <path d="M-6 10 L-8 22 M6 10 L10 21" fill="none" stroke="#56422f" stroke-width="6" stroke-linecap="round"/>
      <path d="M-11 12 Q-14 -6 -4 -12 Q10 -14 14 -4 Q15 8 10 13 Q0 16 -11 12 Z" fill="#5e6e44" stroke="#140d0a" stroke-width="2"/>
      <path d="M6 -12 Q15 -6 14 4 Q12 12 6 14 Q12 2 6 -12 Z" fill="#48563a"/>
      <path d="M-10 4 Q2 8 13 4 L12 12 Q0 16 -10 12 Z" fill="#56422f" stroke="#140d0a" stroke-width="1.3"/>
      <path d="M-6 -4 L10 2" stroke="#3a2a1c" stroke-width="2.4"/>
      <path d="M-8 -14 Q-10 -26 0 -27 Q10 -27 10 -18 Q10 -10 2 -9 Q-6 -9 -8 -14 Z" fill="#5e6e44" stroke="#140d0a" stroke-width="1.8"/>
      <path d="M3 -26 Q10 -24 10 -18 Q10 -11 2 -9 Q8 -16 3 -26 Z" fill="#48563a"/>
      <path d="M-9 -20 L-15 -24 L-10 -17 Z" fill="#5e6e44" stroke="#140d0a" stroke-width="1.2"/>
      <path d="M-5 -20 Q-2 -22 1 -20" fill="none" stroke="#140d0a" stroke-width="1.2"/>
      <circle cx="-2" cy="-18" r="2.4" fill="#ff7a3a" opacity="0.7" filter="url(#suave)"/>
      <circle cx="-2" cy="-18" r="1" fill="#ffd0a0"/>
      <path d="M-5 -12 Q-1 -9 4 -12 L3 -9 Q-1 -7 -4 -9 Z" fill="#1a120e" stroke="#140d0a" stroke-width="0.9"/>
      <path d="M-4 -12 L-4.5 -15.5 L-2.5 -12 Z M2.5 -12 L3 -15.5 L4 -12 Z" fill="#e8dcc0"/>
      <path d="M-10 -6 L-20 -14 L-24 -24 M12 -6 L22 -12 L30 -10" fill="none" stroke="#140d0a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-10 -6 L-20 -14 L-24 -24 M12 -6 L22 -12 L30 -10" fill="none" stroke="#5e6e44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- badlands at dusk; clouds torn open overhead -->
  <rect width="280" height="160" fill="url(#cielo)"/>
  <path d="M0 100 V70 H18 L24 62 H46 L52 72 V100 Z M200 100 V64 L208 56 H240 L246 66 H262 L268 58 H280 V100 Z" fill="#2c220e"/>
  <path d="M52 100 L60 84 H90 L96 92 L120 90 L126 100 Z" fill="#241b0c"/>
  <path d="M0 0 H280 V20 Q262 30 244 22 Q226 32 206 22 Q190 30 170 20 Q150 28 132 18 Q118 22 110 14 L88 0 Z" fill="#221a0b"/>
  <rect width="280" height="160" fill="url(#halo)"/>
  <path d="M0 112 Q70 104 140 110 T280 108 V160 H0 Z" fill="#2a200e"/>
  <path d="M0 128 Q90 120 180 126 T280 124 V160 H0 Z" fill="#17110a"/>

  <!-- the colossal hammer of light -->
  <path d="M189 74 L160 -63 L139 -58 L168 79 Z" fill="#ffd35a" opacity="0.45" filter="url(#brillo)"/>
  <path d="M184.6 75.1 L155.5 -61.9 L143.7 -59.3 L172.8 77.7 Z" fill="url(#mango)" stroke="#fff3c4" stroke-width="1.2"/>
  <path d="M161 21 L172 19 M165.5 41 L176.5 39" stroke="#fff3c4" stroke-width="3" opacity="0.8"/>
  <g transform="translate(182 92) rotate(-12)">
    <rect x="-42" y="-24" width="84" height="48" rx="6" fill="#ffd35a" opacity="0.8" filter="url(#fuerte)"/>
    <path d="M-30 -16 H30 V16 H-30 Z" fill="url(#luz)" stroke="#fff3c4" stroke-width="2"/>
    <path d="M30 -21 H38 V21 H30 Z M-38 -21 H-30 V21 H-38 Z" fill="url(#luz)" stroke="#fff3c4" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-30 -8 H30 M-30 8 H30" stroke="#e0a632" stroke-width="1.2" opacity="0.8"/>
    <circle r="7" fill="none" stroke="#e0a632" stroke-width="1.6"/>
    <path d="M0 -12 V-9 M0 9 V12 M-12 0 H-9 M9 0 H12" stroke="#e0a632" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-28 -14 H10" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- the ground splits in golden lines -->
  <ellipse cx="190" cy="114" rx="60" ry="10" fill="#ffd35a" opacity="0.45" filter="url(#brillo)"/>
  <path d="M190 112 L168 120 L150 118 L128 130 M190 112 L200 126 L196 142 M190 112 L218 118 L236 130 L262 132 M190 112 L176 134 L164 150 M190 112 L214 108 L240 110" fill="none" stroke="#ff9a30" stroke-width="4" opacity="0.7" filter="url(#suave)"/>
  <path d="M190 112 L168 120 L150 118 L128 130 M190 112 L200 126 L196 142 M190 112 L218 118 L236 130 L262 132 M190 112 L176 134 L164 150 M190 112 L214 108 L240 110" fill="none" stroke="#fff0b0" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="190" cy="112" rx="30" ry="5" fill="none" stroke="#fff3c4" stroke-width="1.6" opacity="0.8"/>
  <!-- flying rock shards -->
  <g fill="#4a3a20" stroke="#140d0a" stroke-width="1">
    <path d="M150 96 L156 92 L159 98 L153 101 Z"/><path d="M216 90 L223 88 L224 95 L217 96 Z"/><path d="M204 70 L209 67 L211 72 L206 74 Z"/><path d="M138 108 L143 105 L145 110 L140 112 Z"/>
  </g>

  <!-- orcs thrown aside -->
  <use href="#o" transform="translate(250 62) rotate(58)"/>
  <use href="#o" transform="translate(126 90) rotate(-40) scale(0.8)"/>
  <path d="M258 44 L268 40 L270 42 L260 47 Z" fill="#8d9297" stroke="#140d0a" stroke-width="1"/>

  <!-- the paladin calls down judgement -->
  <use href="#h" transform="translate(45.1 130.9) scale(0.8)" fill="#ffd35a" opacity="0.95"/>
  <use href="#h" transform="translate(44 132) scale(0.8)" fill="#0b0910"/>
  <path d="M47 71.5 L51 71.5" stroke="#ffd35a" stroke-width="1" stroke-linecap="round"/>
  <path d="M66 92 L84 82" stroke="#140d0a" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M66 92 L84 82" stroke="#6a4a26" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(86 81) rotate(-30)">
    <rect x="-5" y="-9" width="10" height="18" rx="2" fill="#ffd35a" opacity="0.9" filter="url(#brillo)"/>
    <path d="M-3.5 -7 H3.5 V7 H-3.5 Z" fill="#ffd35a" stroke="#140d0a" stroke-width="1.3"/>
  </g>
  <path d="M73 88 L76 86.4" stroke="#0b0910" stroke-width="5" stroke-linecap="round"/>

  <rect width="280" height="160" fill="url(#vineta)"/>
</svg>
