name: Backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/core/**', '.github/workflows/server.yml'] # the rooms run the game engine (src/core)
  pull_request:
    paths: ['server/**', 'src/core/**', '.github/workflows/server.yml'] # the rooms run the game engine (src/core)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # Turned on by setting the repository variable CLOUDFLARE_DEPLOY=true
    # (plus the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID).
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply dracs-rogues --remote
      - run: npx wrangler deploy
